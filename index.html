  const fresh = Math.max(0, possible - partnered.size);
  const body = `
    <div class="helptext" style="margin-bottom:10px">Currently ${lastRound} round${lastRound===1?'':'s'} for ${n} players. New rounds are appended after round ${lastRound}; existing matches and scores are kept.</div>
    <div class="field"><label>Rounds to add</label><input type="number" id="fAmAddCount" min="1" max="60" value="${cyc}"></div>
    <div class="row wrap" style="gap:6px;margin-bottom:8px">
      <button type="button" class="btn btn-sm" data-am-preset="${step}">${step} round${step>1?'s':''}</button>
      ${cyc!==step?`<button type="button" class="btn btn-sm" data-am-preset="${cyc}">Full cycle (${cyc})</button>`:''}
      <button type="button" class="btn btn-sm" data-am-preset="${cyc*2}">2 cycles (${cyc*2})</button>
    </div>
    <div class="helptext" id="fAmAddNote"></div>`;
  openDialog('Add Americano rounds', body, stdFoot('btnSaveAmAdd','Add rounds'));
  const inp = document.getElementById('fAmAddCount'), note = document.getElementById('fAmAddNote');
  const refresh = ()=>{
    const c = Math.max(1, parseInt(inp.value,10)||1);
    const equal = c % step === 0;
    note.innerHTML = (equal
      ? `Everyone gets the same number of extra games.`
      : `Game counts will differ by 1 between players - use a multiple of <b>${step}</b> to keep them equal.`)
      + ` ${fresh ? `${fresh} pair${fresh===1?' has':'s have'} never partnered yet - they're used first; after that` : 'Every possible pair has partnered already, so'} repeat partners are spread as evenly as possible.`;
  };
  inp.addEventListener('input', refresh);
  document.querySelectorAll('[data-am-preset]').forEach(b=>b.addEventListener('click', ()=>{ inp.value = b.getAttribute('data-am-preset'); refresh(); }));
  refresh();
  document.getElementById('btnSaveAmAdd').onclick = async ()=>{
    const c = parseInt(inp.value,10);
    if(!c || c<1){ toast('Enter how many rounds to add', true); return; }
    await addAmericanoRounds(eventById(ev.id), c);
    closeGenericDialog(); render();
  };
}
/* Mixed Americano (PadelMix): every team is one man + one woman, requiring an
   equal head count of each and at least 4 of each. The female half of each
   team rotates by a fixed offset each round so every man partners every
   woman exactly once over n rounds; opponents are then drawn from the same
   verified round-robin schedule (reused as an index-pairing, not a partner
   list here) so head-to-heads vary too. */
function buildMixedAmericano(ctx, entries){
  const males = entries.filter(e=>{ const p=playerById(e.player1Id); return p && p.gender==='male'; });
  const females = entries.filter(e=>{ const p=playerById(e.player1Id); return p && p.gender==='female'; });
  if(males.length<4 || females.length<4 || males.length!==females.length){
    throw new Error('Mixed Americano needs an equal number of men and women, at least 4 of each.');
  }
  const n = males.length;
  const oppSchedule = DrawGenerator.roundRobinSchedule(n);
  const teamEntries = [], matches = [];
  for(let r=0;r<n;r++){
    const teams = males.map((m,i)=>{
      const f = females[(i+r)%n];
      const team = {id:uid(), eventId:ctx.eventId, player1Id:m.player1Id, player2Id:f.player1Id,
        seed:null, clubId:null, registrationId:null, isAmericanoTeam:true, americanoRound:r+1};
      teamEntries.push(team);
      return team;
    });
    const pairs = oppSchedule[r % Math.max(oppSchedule.length,1)] || [];
    pairs.forEach(([a,b], pi)=>{
      const m = baseMatch({...ctx, bracket:'AM', round:r+1, position:pi, e1:teams[a], e2:teams[b]});
      m.id = uid();
      matches.push(m);
    });
  }
  markSchedulable(matches);
  return {matches, teamEntries};
}
/* Mexicano pairing: given individual entries already ordered strongest-first
   (random for round 1, by live standings afterwards), splits them into
   foursomes and pairs rank 1&3 vs 2&4 within each foursome (the standard
   Mexicano pattern) so matches stay close as the field separates. Anyone left
   over (count not a multiple of 4) sits out that round. */
function mexicanoFoursomePairs(orderedIndividualEntries){
  const n = orderedIndividualEntries.length;
  const groups = [];
  let i=0;
  for(; i+4<=n; i+=4) groups.push(orderedIndividualEntries.slice(i,i+4));
  const sitOut = orderedIndividualEntries.slice(i);
  const teamPairs = groups.map(g=>[[g[0],g[2]],[g[1],g[3]]]);
  return {teamPairs, sitOut};
}
function buildMexicanoRound(ctx, orderedIndividualEntries, roundNum){
  const {teamPairs, sitOut} = mexicanoFoursomePairs(orderedIndividualEntries);
  const teamEntries=[], matches=[];
  teamPairs.forEach(([tA,tB], pi)=>{
    const teamA = {id:uid(), eventId:ctx.eventId, player1Id:tA[0].player1Id, player2Id:tA[1].player1Id,
      seed:null, clubId:null, registrationId:null, isAmericanoTeam:true, americanoRound:roundNum};
    const teamB = {id:uid(), eventId:ctx.eventId, player1Id:tB[0].player1Id, player2Id:tB[1].player1Id,
      seed:null, clubId:null, registrationId:null, isAmericanoTeam:true, americanoRound:roundNum};
    teamEntries.push(teamA, teamB);
    const m = baseMatch({...ctx, bracket:'AM', round:roundNum, position:pi, e1:teamA, e2:teamB});
    m.id = uid();
    matches.push(m);
  });
  markSchedulable(matches);
  return {matches, teamEntries, sitOut};
}
/* Admin action for the Mexicano variant: draws are generated one round at a
   time (unlike Classic/Mixed, whose full schedule is built up front) because
   each round's pairing depends on standings the previous round produced. */
async function generateNextMexicanoRound(event){
  return act(async ()=>{
    const draw = eventDraw(event.id);
    if(!draw || draw.format!=='americano' || (event.americanoVariant||'classic')!=='mexicano'){
      throw new Error('This is only for Mexicano-variant Americano events.');
    }
    const matches = eventMatches(event.id);
    const individualEntries = eventEntries(event.id).filter(e=>!e.isAmericanoTeam);
    if(!individualEntries.length) throw new Error('No players to pair.');
    const lastRound = matches.length ? Math.max(...matches.map(m=>m.round)) : 0;
    const roundMatches = matches.filter(m=>m.round===lastRound);
    if(lastRound>0 && roundMatches.some(m=>!['completed','walkover','retired','bye'].includes(m.status))){
      throw new Error('Finish scoring round ' + lastRound + ' before generating the next one.');
    }
    const standing = computeAmericanoStandings(individualEntries, matches);
    const byPlayerId = {}; individualEntries.forEach(e=>{ byPlayerId[e.player1Id]=e; });
    const orderedEntries = standing.map(r=>byPlayerId[r.playerId]).filter(Boolean);
    const nextRound = lastRound+1;
    const built = buildMexicanoRound({tournamentId:event.tournamentId, eventId:event.id, drawId:draw.id}, orderedEntries, nextRound);
    for(const te of built.teamEntries) await Store.add('entries', te, te.id);
    for(const m of built.matches) await Store.add('matches', m, m.id);
    toast('Round ' + nextRound + ' generated' + (built.sitOut.length ? (' - ' + built.sitOut.map(e=>playerName(e.player1Id)).join(', ') + ' sit out (not a multiple of 4)') : ''));
  });
}
function buildGroupsStage(ctx, entries, groupSize){
  const groupIdxs = DrawGenerator.splitGroups(entries.length, groupSize||4);
  const groups = groupIdxs.map((idxs,gi)=>({
    id: uid(), name: 'Group ' + String.fromCharCode(65+gi), entryIds: idxs.map(i=>entries[i].id)
  }));
  let matches=[];
  groups.forEach(g=>{
    const groupEntries = g.entryIds.map(id=>entries.find(e=>e.id===id));
    matches = matches.concat(buildRoundRobin({...ctx, groupId:g.id}, groupEntries));
  });
  return {groups, matches};
}

/* Cross-group seeding for the knockout stage once group play is complete:
   rank-1s first (in group order), then rank-2s reversed, etc. (simple snake -
   perfect anti-rematch seeding isn't required, just a sane spread). */
function seedQualifiers(groups, standingsByGroup, qualifiersPerGroup){
  const out=[];
  for(let r=0;r<qualifiersPerGroup;r++){
    const tier=[];
    groups.forEach(g=>{
      const st = standingsByGroup[g.id]||[];
      if(st[r]) tier.push(st[r].entry);
    });
    out.push(...(r%2===0 ? tier : tier.slice().reverse()));
  }
  return out;
}

function buildDoubleElimination(ctx, entries, opts){
  opts = opts||{};
  const N = entries.length;
  if(N<2) return [];
  const S = DrawGenerator.nextPowerOfTwo(N);
  const n = Math.log2(S);
  if(n<=1) return buildSingleElimination(ctx, entries, opts);

  const plans = DrawGenerator.singleEliminationPlan(N);
  const wbByRoundPos = {};
  const all = [];
  for(const p of plans){
    const e1 = p.entry1Index!=null?entries[p.entry1Index]:null;
    const e2 = p.entry2Index!=null?entries[p.entry2Index]:null;
    const m = baseMatch({...ctx, bracket:'WB', round:p.round, position:p.position, e1, e2});
    m.id = uid();
    all.push(m);
    (wbByRoundPos[p.round]=wbByRoundPos[p.round]||{})[p.position]=m;
  }
  for(let r=1;r<n;r++){
    const thisRound=wbByRoundPos[r], nextRound=wbByRoundPos[r+1];
    Object.keys(thisRound).forEach(posStr=>{
      const pos=+posStr, m=thisRound[pos];
      const nextPos=Math.floor(pos/2);
      const next=nextRound[nextPos];
      m.nextMatchId=next.id; m.nextMatchSlot=(pos%2===0)?1:2;
    });
  }
  const wbFinal = wbByRoundPos[n][0];

  let lbRoundNum=1;
  const lb=[];
  function mkLB(pos){
    const m = baseMatch({...ctx, bracket:'LB', round:lbRoundNum, position:pos, e1:null, e2:null});
    m.id = uid(); lb.push(m); return m;
  }
  const r1Matches = Object.values(wbByRoundPos[1]).sort((a,b)=>a.position-b.position);
  let survivors = [];
  for(let i=0;i<r1Matches.length;i+=2){
    const m = mkLB(i/2);
    r1Matches[i].loserNextMatchId = m.id; r1Matches[i].loserNextMatchSlot = 1;
    r1Matches[i+1].loserNextMatchId = m.id; r1Matches[i+1].loserNextMatchSlot = 2;
    survivors.push(m);
  }
  lbRoundNum++;
  for(let r=2;r<=n;r++){
    const wbLosers = Object.values(wbByRoundPos[r]).sort((a,b)=>a.position-b.position);
    const dropIn = [];
    for(let i=0;i<wbLosers.length;i++){
      const m = mkLB(i);
      survivors[i].nextMatchId = m.id; survivors[i].nextMatchSlot = 1;
      wbLosers[i].loserNextMatchId = m.id; wbLosers[i].loserNextMatchSlot = 2;
      dropIn.push(m);
    }
    lbRoundNum++;
    if(r<n){
      const compressed=[];
      for(let i=0;i<dropIn.length;i+=2){
        const m = mkLB(i/2);
        dropIn[i].nextMatchId = m.id; dropIn[i].nextMatchSlot = 1;
        dropIn[i+1].nextMatchId = m.id; dropIn[i+1].nextMatchSlot = 2;
        compressed.push(m);
      }
      lbRoundNum++;
      survivors = compressed;
    } else {
      survivors = dropIn;
    }
  }
  const lbFinal = survivors[0];

  const gf1 = baseMatch({...ctx, bracket:'GF', round:1, position:0, e1:null, e2:null});
  gf1.id = uid(); gf1.grKind='gf1';
  wbFinal.nextMatchId = gf1.id; wbFinal.nextMatchSlot = 1;
  lbFinal.nextMatchId = gf1.id; lbFinal.nextMatchSlot = 2;

  const list = all.concat(lb, [gf1]);
  markSchedulable(list);
  resolveByeCascade(list);
  return list;
}

/* Modal dialogs live in the browser's "top layer", above everything else on the
   page, so a toast in the page body would be hidden behind an open dialog (and
   its dimmed backdrop). The toast host therefore moves into the top-most open
   dialog while one is open, and back to the page when it closes. */
function placeToastHost(){
  const host=document.getElementById('toastHost'); if(!host) return null;
  const open=[...document.querySelectorAll('dialog[open]')];
  const parent = open.length ? open[open.length-1] : document.body;
  if(host.parentElement!==parent) parent.appendChild(host);
  return host;
}
document.addEventListener('close', ()=>setTimeout(placeToastHost, 0), true);
function toast(msg, isError){
  const host=placeToastHost();
  if(!host) return;
  const el=document.createElement('div'); el.className='toast'+(isError?' error':''); el.textContent=msg;
  host.appendChild(el);
  if(Native.has('sbHaptic')) Native.post('sbHaptic', isError?'error':'success');
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, isError ? 4500 : 2600);
}

/* ============================== CONFLICTS / SCHEDULING ============================== */
function timeOverlap(s1,e1,s2,e2){ return s1<e2 && s2<e1; }
function matchWindow(m){
  if(!m.scheduledStart) return null;
  const start = new Date(m.scheduledStart).getTime();
  if(isNaN(start)) return null;
  const end = start + (m.estDurationMin||30)*60000;
  return {start,end};
}
/* Returns [] when clear, else a list of {type:'court'|'rest', match}. Both
   entries in a doubles pair count as "the same player" being busy. */
function checkSchedulingConflict(tournamentId, matchId, courtId, scheduledStart, estDurationMin, restMinutes){
  const win = matchWindow({scheduledStart, estDurationMin});
  if(!win) return [];
  const thisMatch = matchById(matchId) || {};
  const thisPlayers = new Set(matchEntryPlayerIds({...thisMatch, entry1Id:thisMatch.entry1Id, entry2Id:thisMatch.entry2Id}));
  const conflicts=[];
  for(const m of state.matches){
    if(m.id===matchId) continue;
    if(m.tournamentId!==tournamentId) continue;
    if(['cancelled'].includes(m.status)) continue;
    const oWin = matchWindow(m);
    if(!oWin) continue;
    if(courtId && m.courtId===courtId && timeOverlap(win.start,win.end,oWin.start,oWin.end)){
      conflicts.push({type:'court', match:m});
      continue;
    }
    const oPlayers = new Set(matchEntryPlayerIds(m));
    const shared = [...thisPlayers].some(p=>oPlayers.has(p));
    if(shared){
      const rest = (restMinutes||0)*60000;
      if(timeOverlap(win.start-rest, win.end+rest, oWin.start, oWin.end)){
        conflicts.push({type:'rest', match:m});
      }
    }
  }
  return conflicts;
}

/* ============================== STANDINGS / STATS ============================== */
const TIEBREAK_DEFAULT = ['wins','h2h','gameDiff','pointDiff','pointsFor'];
function computeGroupStandings(entryIds, matches, tiebreak){
  tiebreak = tiebreak || TIEBREAK_DEFAULT;
  const rows = {};
  entryIds.forEach(id=> rows[id] = {entryId:id, entry:entryById(id), played:0, wins:0, losses:0, gamesWon:0, gamesLost:0, pointsFor:0, pointsAgainst:0, h2h:{}});
  matches.filter(m=> m.status==='completed'||m.status==='walkover'||m.status==='retired').forEach(m=>{
    if(!rows[m.entry1Id] || !rows[m.entry2Id]) return;
    let g1=0,g2=0,p1=0,p2=0;
    (m.games||[]).forEach(g=>{ const w=ScoreRules.gameWinner(g); if(w===1) g1++; else if(w===2) g2++; p1+=g.a||0; p2+=g.b||0; });
    rows[m.entry1Id].played++; rows[m.entry2Id].played++;
    rows[m.entry1Id].gamesWon+=g1; rows[m.entry1Id].gamesLost+=g2;
    rows[m.entry2Id].gamesWon+=g2; rows[m.entry2Id].gamesLost+=g1;
    rows[m.entry1Id].pointsFor+=p1; rows[m.entry1Id].pointsAgainst+=p2;
    rows[m.entry2Id].pointsFor+=p2; rows[m.entry2Id].pointsAgainst+=p1;
    const winner = m.winnerEntryId;
    if(winner===m.entry1Id){ rows[m.entry1Id].wins++; rows[m.entry2Id].losses++; rows[m.entry1Id].h2h[m.entry2Id]='W'; rows[m.entry2Id].h2h[m.entry1Id]='L'; }
    else if(winner===m.entry2Id){ rows[m.entry2Id].wins++; rows[m.entry1Id].losses++; rows[m.entry2Id].h2h[m.entry1Id]='W'; rows[m.entry1Id].h2h[m.entry2Id]='L'; }
  });
  const list = Object.values(rows);
  list.forEach(r=>{ r.gameDiff = r.gamesWon-r.gamesLost; r.pointDiff = r.pointsFor-r.pointsAgainst; });
  list.sort((a,b)=>{
    for(const key of tiebreak){
      if(key==='wins'){ if(b.wins!==a.wins) return b.wins-a.wins; }
      else if(key==='h2h'){ const ah=a.h2h[b.entryId], bh=b.h2h[a.entryId]; if(ah==='W'&&bh==='L') return -1; if(ah==='L'&&bh==='W') return 1; }
      else if(key==='gameDiff'){ if(b.gameDiff!==a.gameDiff) return b.gameDiff-a.gameDiff; }
      else if(key==='pointDiff'){ if(b.pointDiff!==a.pointDiff) return b.pointDiff-a.pointDiff; }
      else if(key==='pointsFor'){ if(b.pointsFor!==a.pointsFor) return b.pointsFor-a.pointsFor; }
    }
    return entryName(a.entry).localeCompare(entryName(b.entry));
  });
  return list;
}
/* Americano ranking is per PLAYER, not per entry, since a player's "entry"
   (team) changes every round. individualEntries = the one-per-player
   registration entries (player2Id null); matches carry ad-hoc team entries. */
function computeAmericanoStandings(individualEntries, matches){
  const rows = {};
  individualEntries.forEach(e=> rows[e.player1Id] = {playerId:e.player1Id, played:0, wins:0, losses:0, pointsFor:0, pointsAgainst:0});
  matches.filter(m=> (m.status==='completed'||m.status==='walkover'||m.status==='retired') && (m.games||[]).length).forEach(m=>{
    const e1=entryById(m.entry1Id), e2=entryById(m.entry2Id);
    if(!e1||!e2) return;
    let p1=0,p2=0; (m.games||[]).forEach(g=>{ p1+=g.a||0; p2+=g.b||0; });
    const aWon = m.winnerEntryId===m.entry1Id;
    entryPlayerIds(e1).forEach(pid=>{ if(!rows[pid]) return; rows[pid].played++; rows[pid].pointsFor+=p1; rows[pid].pointsAgainst+=p2; if(aWon) rows[pid].wins++; else rows[pid].losses++; });
    entryPlayerIds(e2).forEach(pid=>{ if(!rows[pid]) return; rows[pid].played++; rows[pid].pointsFor+=p2; rows[pid].pointsAgainst+=p1; if(aWon) rows[pid].losses++; else rows[pid].wins++; });
  });
  return Object.values(rows).sort((a,b)=> b.pointsFor-a.pointsFor || b.wins-a.wins || playerName(a.playerId).localeCompare(playerName(b.playerId)));
}

/* ============================== RANKING POINTS ============================== */
/* Simple, stated formula (shown in a UI tooltip, never hidden):
   Elimination stage reached - Champion 100, Runner-up 70, Semifinal 45,
   Quarterfinal 25, Round of 16 15, earlier rounds 5.
   Group/round-robin final standing - 1st 100, 2nd 70, 3rd 50, 4th 35, else 10. */
const RANKING_POINTS_TOOLTIP = 'Points: Champion 100 · Runner-up 70 · Semifinal 45 · Quarterfinal 25 · Round of 16 15 · Participation 5 (knockout). Round-robin/group: 1st 100 · 2nd 70 · 3rd 50 · 4th 35 · else 10.';
function stagePointsByDistance(distanceFromFinal, won){
  if(won && distanceFromFinal===0) return 100;
  if(distanceFromFinal===0) return 70;
  if(distanceFromFinal===1) return 45;
  if(distanceFromFinal===2) return 25;
  if(distanceFromFinal===3) return 15;
  return 5;
}
function standingPoints(rank){
  if(rank===1) return 100;
  if(rank===2) return 70;
  if(rank===3) return 50;
  if(rank===4) return 35;
  return 10;
}

function roundLabelFor(bracket, round, maxRound, isThirdPlace){
  if(isThirdPlace) return 'Third place';
  if(bracket==='GF') return 'Grand Final';
  if(bracket==='RR'||bracket==='GRP'||bracket==='AM') return 'Round '+round;
  const fromEnd = maxRound-round;
  if(fromEnd===0) return bracket==='LB' ? 'Losers Final' : 'Final';
  if(fromEnd===1) return (bracket==='LB'?'Losers ':'')+'Semifinal';
  if(fromEnd===2) return (bracket==='LB'?'Losers ':'')+'Quarterfinal';
  return (bracket==='LB'?'Losers Round ':'Round ')+round;
}

function computeEventPlacements(eventId){
  const matches = eventMatches(eventId);
  const entries = eventEntries(eventId);
  const placements = {};
  if(!entries.length) return placements;
  const hasDE = matches.some(m=>m.bracket==='WB'||m.bracket==='LB'||m.bracket==='GF');
  const hasSE = matches.some(m=>m.bracket==='SE');
  const hasGroup = matches.some(m=>m.bracket==='GRP');
  const hasRR = matches.some(m=>m.bracket==='RR');
  const hasAM = matches.some(m=>m.bracket==='AM');
  if(hasSE || hasDE){
    const backbone = matches.filter(m=> hasDE ? m.bracket==='WB' : (m.bracket==='SE' && !m.isThirdPlace));
    const maxRound = backbone.length ? Math.max(...backbone.map(m=>m.round)) : 0;
    const priority = {GF:3, SE:2, WB:2, LB:1};
    entries.forEach(en=>{
      const involved = matches.filter(m=> (m.entry1Id===en.id||m.entry2Id===en.id) &&
        ['completed','bye','walkover','retired'].includes(m.status));
      if(!involved.length){ placements[en.id]={points:0,label:'Did not play'}; return; }
      involved.sort((a,b)=> (priority[b.bracket]-priority[a.bracket]) || (b.round-a.round));
      const last = involved[0];
      const won = last.winnerEntryId===en.id;
      if(won && last.bracket==='GF'){ placements[en.id]={points:100,label:'Champion'}; return; }
      if(won && last.bracket==='SE' && !last.nextMatchId){ placements[en.id]={points:100,label:'Champion'}; return; }
      if(last.bracket==='GF' && !won){ placements[en.id]={points:70,label:'Runner-up'}; return; }
      if(last.bracket==='LB' && !last.nextMatchId && won){ placements[en.id]={points:70,label:'Runner-up'}; return; }
      const dist = Math.max(0, maxRound-last.round);
      placements[en.id] = {points: stagePointsByDistance(dist,false), label: roundLabelFor(last.bracket,last.round,maxRound,last.isThirdPlace)};
    });
  } else if(hasAM){
    const individualEntries = entries.filter(e=>!e.isAmericanoTeam);
    const standing = computeAmericanoStandings(individualEntries, matches);
    standing.forEach((row,i)=>{
      const ent = individualEntries.find(e=>e.player1Id===row.playerId);
      if(ent) placements[ent.id] = {points: standingPoints(i+1), label:'#'+(i+1)};
    });
  } else if(hasGroup || hasRR){
    const draw = eventDraw(eventId);
    const groups = (draw && draw.groups && draw.groups.length) ? draw.groups : [{id:null, name:'', entryIds:entries.map(e=>e.id)}];
    groups.forEach(g=>{
      const gEntries = (g.entryIds && g.entryIds.length) ? g.entryIds : entries.map(e=>e.id);
      const gMatches = matches.filter(m=> g.id ? m.groupId===g.id : !m.groupId);
      const standing = computeGroupStandings(gEntries, gMatches, (draw&&draw.tiebreak)||TIEBREAK_DEFAULT);
      standing.forEach((row,i)=>{ placements[row.entryId] = {points: standingPoints(i+1), label:'#'+(i+1)+(g.name?' '+g.name:'')}; });
    });
  }
  return placements;
}

function computePlayerStats(filterFn){
  const stats = {};
  function ensure(pid){
    if(!stats[pid]) stats[pid] = {playerId:pid, player:playerById(pid), matchesPlayed:0, wins:0, losses:0,
      gamesWon:0, gamesLost:0, pointsFor:0, pointsAgainst:0, tournaments:new Set(), titles:0, rankingPoints:0};
    return stats[pid];
  }
  const placementsByEvent = {};
  state.events.forEach(ev=>{ placementsByEvent[ev.id] = computeEventPlacements(ev.id); });
  state.entries.forEach(entry=>{
    const pids = entryPlayerIds(entry);
    const ev = eventById(entry.eventId);
    if(!pids.length || !ev) return;
    const pl = placementsByEvent[ev.id] && placementsByEvent[ev.id][entry.id];
    pids.forEach(pid=>{
      const s = ensure(pid);
      s.tournaments.add(ev.tournamentId);
      if(pl){ s.rankingPoints += pl.points; if(pl.label==='Champion') s.titles++; }
    });
  });
  state.matches.forEach(m=>{
    if(!['completed','walkover','retired'].includes(m.status)) return;
    [[m.entry1Id,1],[m.entry2Id,2]].forEach(([entryId,side])=>{
      const entry = entryById(entryId); if(!entry) return;
      const pids = entryPlayerIds(entry);
      let g1=0,g2=0,p1=0,p2=0;
      (m.games||[]).forEach(g=>{ const w=ScoreRules.gameWinner(g); if(w===1)g1++; else if(w===2)g2++; p1+=g.a||0; p2+=g.b||0; });
      const won = m.winnerEntryId===entryId;
      const gw = side===1?g1:g2, gl = side===1?g2:g1, pf = side===1?p1:p2, pa = side===1?p2:p1;
      pids.forEach(pid=>{
        const s = ensure(pid);
        s.matchesPlayed++; if(won) s.wins++; else s.losses++;
        s.gamesWon+=gw; s.gamesLost+=gl; s.pointsFor+=pf; s.pointsAgainst+=pa;
      });
    });
  });
  return Object.values(stats).map(s=>({...s, tournamentsCount:s.tournaments.size,
    winPct: s.matchesPlayed ? Math.round(100*s.wins/s.matchesPlayed) : 0
  })).filter(s=> !filterFn || filterFn(s));
}

function findDuplicateRegistration(eventId, playerId){
  return state.registrations.find(r=> r.eventId===eventId && r.playerId===playerId && r.status!=='withdrawn' && r.status!=='rejected');
}
async function registerForEvent(tournamentId, eventId, playerId, partnerId){
  if(!playerId){ toast('Pick a player profile first', true); return; }
  if(partnerId && partnerId===playerId){ toast('A pair cannot be the same player twice', true); return; }
  if(findDuplicateRegistration(eventId, playerId)){ toast('Already registered for this event', true); return; }
  if(partnerId && findDuplicateRegistration(eventId, partnerId)){ toast('Partner is already registered for this event', true); return; }
  return act(async ()=>{
    const id = await Store.add('registrations', {tournamentId, eventId, playerId, partnerId:partnerId||null, status:'pending', registeredAt: nowIso()});
    await notify(tournamentId, playerId, 'registration_submitted', 'Registration submitted for ' + (eventById(eventId)||{}).name + '.');
    return id;
  }, 'Registered - awaiting confirmation');
}

   players") — same validation as self-service, but confirmed immediately rather

async function adminRegisterPlayer(tournamentId, eventId, playerId, partnerId){

/* Withdrawing after a draw is generated must not corrupt the bracket: give
   any remaining unplayed match a walkover to the opponent (or leave TBD if
   there is no opponent yet), never leave a dangling reference. */
async function handleWithdrawal(reg){
  const entry = state.entries.find(e=> e.registrationId===reg.id) || state.entries.find(e=> e.player1Id===reg.playerId && e.eventId===reg.eventId) || null;
  if(!entry) return;
  const affected = eventMatches(entry.eventId).filter(m=> (m.entry1Id===entry.id||m.entry2Id===entry.id) && !['completed'].includes(m.status));
  for(const m of affected){
    const isSide1 = m.entry1Id===entry.id;
    const oppId = isSide1 ? m.entry2Id : m.entry1Id;
    if(oppId){
      await completeMatch(m, {status:'walkover', winnerEntryId:oppId, games:m.games||[]}, {silent:true});
    } else {
      await Store.update('matches', m.id, isSide1 ? {entry1Id:null} : {entry2Id:null});
    }
  }
  await audit(reg.tournamentId, state.role, 'player_withdrawn', playerName(reg.playerId) + ' withdrew from ' + (eventById(reg.eventId)||{}).name + '.');
}

/* Build actual draw entries from confirmed registrations (paired for doubles). */
async function buildEntriesFromRegistrations(event){
  return act(async ()=>{
    const allRegs = await Store.getAll('registrations', [['eventId', event.id]]);
    const regs = allRegs.filter(r=> r.status==='confirmed');
    const existing = await Store.getAll('entries', [['eventId', event.id]]);
    for(const en of existing) await Store.remove('entries', en.id);
    const doubles = isDoublesType(event.type);
    const seen = new Set();
    for(const r of regs){
      if(seen.has(r.id)) continue;
      if(doubles && !r.partnerId) continue; // needs a partner before entering
      seen.add(r.id);
      const p1club = (playerById(r.playerId)||{}).clubId || null;
      await Store.add('entries', {
        eventId:event.id, player1Id:r.playerId, player2Id: doubles ? r.partnerId : null,
        seed:null, clubId:p1club, registrationId:r.id
      });
    }
  }, 'Entries built from confirmed registrations');
}

/* ---- Draw generation ---- */
async function generateDraw(event, opts){
  opts = opts || {};
  const tournament = tournamentById(event.tournamentId);
  await buildEntriesFromRegistrations(event);
  const entriesRaw = eventEntries(event.id).length ? eventEntries(event.id) : await Store.getAll('entries', [['eventId', event.id]]);
  if(entriesRaw.length < 2){ toast('Need at least 2 confirmed entries to generate a draw', true); return; }
  if(event.drawFormat==='americano' && entriesRaw.length < 4){ toast('Americano needs at least 4 confirmed entries', true); return; }
  const seeded = entriesRaw.filter(e=>e.seed!=null).sort((a,b)=>a.seed-b.seed);
  const unseeded = entriesRaw.filter(e=>e.seed==null).sort(()=> Math.random()-0.5);
  const ordered = [...seeded, ...unseeded];
  const ctx = {tournamentId: event.tournamentId, eventId: event.id, drawId:null};
  const format = event.drawFormat || 'single_elimination';

  return act(async ()=>{
    const existingDraw = eventDraw(event.id);
    if(existingDraw && existingDraw.status==='published' && !opts.confirmedRegen){
      toast('This draw is already published - use "Regenerate" to confirm.', true); return;
    }
    if(existingDraw){
      for(const m of eventMatches(event.id)) await Store.remove('matches', m.id);
      if(existingDraw.format==='americano'){
        for(const te of eventEntries(event.id).filter(e=>e.isAmericanoTeam)) await Store.remove('entries', te.id);
      }
      await Store.remove('draws', existingDraw.id);
      if(existingDraw.status==='published') await audit(event.tournamentId, state.role, 'draw_regenerated', 'Draw regenerated for ' + event.name + '.');
    }
    const drawId = uid();
    ctx.drawId = drawId;
    let matches = [], groups = null, americanoSitOut = null;
    if(format==='round_robin'){
      matches = buildRoundRobin(ctx, ordered);
    } else if(format==='americano'){
      const variant = event.americanoVariant||'classic';
      let built;
      if(variant==='mixed') built = buildMixedAmericano(ctx, ordered);
      else if(variant==='mexicano') built = buildMexicanoRound(ctx, ordered.slice().sort(()=>Math.random()-0.5), 1);
      else built = buildAmericano(ctx, ordered);
      matches = built.matches;
      americanoSitOut = built.sitOut || null;
      for(const te of built.teamEntries) await Store.add('entries', te, te.id);
    } else if(format==='group_knockout'){
      const built = buildGroupsStage(ctx, ordered, opts.groupSize||4);
      matches = built.matches; groups = built.groups;
    } else if(format==='double_elimination'){
      matches = buildDoubleElimination(ctx, ordered, {thirdPlace:event.thirdPlaceMatch});
    } else {
      matches = buildSingleElimination(ctx, ordered, {thirdPlace:event.thirdPlaceMatch});
    }
    await Store.add('draws', {
      eventId:event.id, format, groups: groups||[], status:'published', generatedAt: nowIso(),
      qualifiersPerGroup: opts.qualifiersPerGroup||2, groupSize: opts.groupSize||4, tiebreak: TIEBREAK_DEFAULT,
      americanoSitOut
    }, drawId);
    for(const m of matches) await Store.add('matches', m, m.id);
    await Store.update('events', event.id, {status:'draw_published'});
    await notify(event.tournamentId, null, 'draw_published', 'Draw published for ' + event.name + '.');
  }, 'Draw generated');
}

/* Once every group match is complete, seed the qualifiers into a knockout
   bracket appended to the same draw. */
async function generateKnockoutFromGroups(event){
  const draw = eventDraw(event.id);
  if(!draw || draw.format!=='group_knockout') return;
  const groupMatches = eventMatches(event.id).filter(m=>m.bracket==='GRP');
  const allDone = groupMatches.every(m=> ['completed','walkover','retired','bye'].includes(m.status));
  if(!allDone){ toast('All group matches must be completed first', true); return; }
  return act(async ()=>{
    const standingsByGroup = {};
    draw.groups.forEach(g=>{
      standingsByGroup[g.id] = computeGroupStandings(g.entryIds, groupMatches.filter(m=>m.groupId===g.id), draw.tiebreak);
    });
    const qualifierEntries = seedQualifiers(draw.groups, standingsByGroup, draw.qualifiersPerGroup||2).map(e=>entryById(e.entryId) || e);
    const ctx = {tournamentId:event.tournamentId, eventId:event.id, drawId:draw.id};
    const koMatches = buildSingleElimination(ctx, qualifierEntries.map(e=> e.id ? e : entryById(e.entryId)), {thirdPlace:event.thirdPlaceMatch});
    for(const m of koMatches) await Store.add('matches', m, m.id);
    await notify(event.tournamentId, null, 'draw_published', 'Knockout stage seeded for ' + event.name + '.');
  }, 'Knockout bracket generated from group standings');
}

/* ============================== MATCH COMPLETION / ADVANCEMENT ============================== */
/* Shared, idempotent completion path used by live scoring, walkovers,
   retirements, and admin corrections. A completed winner is never advanced
   twice: re-completion only happens via an explicit forceCorrection (which is
   audit-logged) and even then re-propagates deterministically. */
async function completeMatch(match, result, opts){
  opts = opts||{};
  const alreadyDone = ['completed','walkover','retired','bye'].includes(match.status);
  if(alreadyDone && !opts.forceCorrection){
    return; // idempotency guard - never silently re-advance a decided match
  }
  const patch = {
    games: result.games||match.games||[], status: result.status,
    winnerEntryId: result.winnerEntryId, actualEnd: nowIso(), updatedAt: nowIso()
  };
  if(!match.actualStart && (result.status==='completed'||result.status==='walkover'||result.status==='retired')) patch.actualStart = match.actualStart || nowIso();
  await Store.update('matches', match.id, patch);
  const loserEntryId = result.winnerEntryId===match.entry1Id ? match.entry2Id : match.entry1Id;

  if(match.nextMatchId){
    const next = matchById(match.nextMatchId) || await singleDoc('matches', match.nextMatchId);
    if(next && (opts.forceCorrection || (match.nextMatchSlot===1 ? !next.entry1Id : !next.entry2Id))){
      const field = match.nextMatchSlot===1 ? 'entry1Id' : 'entry2Id';
      await Store.update('matches', match.nextMatchId, {[field]: result.winnerEntryId});
      await maybeResolveByeLive(match.nextMatchId);
    }
  }
  if(match.loserNextMatchId && loserEntryId && result.status!=='bye'){
    const nextL = matchById(match.loserNextMatchId) || await singleDoc('matches', match.loserNextMatchId);
    if(nextL && (opts.forceCorrection || (match.loserNextMatchSlot===1 ? !nextL.entry1Id : !nextL.entry2Id))){
      const field = match.loserNextMatchSlot===1 ? 'entry1Id' : 'entry2Id';
      await Store.update('matches', match.loserNextMatchId, {[field]: loserEntryId});
      await maybeResolveByeLive(match.loserNextMatchId);
    }
  }
  if(match.grKind==='gf1' && result.status==='completed' && result.winnerEntryId===match.entry2Id){
    await maybeCreateBracketReset(match);
  }
  if(!opts.silent){
    await notify(match.tournamentId, null, 'match_completed',
      entryName(entryById(match.entry1Id)) + ' vs ' + entryName(entryById(match.entry2Id)) + ' - result recorded.');
  }
  if(opts.forceCorrection){
    await audit(match.tournamentId, state.role, 'score_correction', 'Score corrected for match ' + match.id + ' after completion.');
  }
  await checkEventCompletion(match.eventId);
}
/* Small helper: read a match doc that may not yet be in local state (e.g. was
   just added in the same tick). Falls back to in-memory state first. */
async function singleDoc(col, id){
  const local = col==='matches' ? matchById(id) : null;
  if(local) return local;
  try{
    const rows = await Store.getAll(col, []);
    return rows.find(r=>r.id===id) || null;
  }catch(e){ return null; }
}
async function maybeResolveByeLive(matchId){
  const m = matchById(matchId) || await singleDoc('matches', matchId);
  if(!m || m.status==='completed' || m.status==='bye') return;
  const has1=!!m.entry1Id, has2=!!m.entry2Id;
  if(has1!==has2){
    const winnerEntryId = has1?m.entry1Id:m.entry2Id;
    await Store.update('matches', matchId, {status:'bye', winnerEntryId});
    if(m.nextMatchId){
      const next = matchById(m.nextMatchId) || await singleDoc('matches', m.nextMatchId);
      if(next && (m.nextMatchSlot===1 ? !next.entry1Id : !next.entry2Id)){
        await Store.update('matches', m.nextMatchId, {[m.nextMatchSlot===1?'entry1Id':'entry2Id']: winnerEntryId});
        await maybeResolveByeLive(m.nextMatchId);
      }
    }
  }
}
async function maybeCreateBracketReset(gf1){
  const already = state.matches.find(m=> m.grKind==='gf2' && m.drawId===gf1.drawId);
  if(already) return;
  await Store.add('matches', {
    tournamentId:gf1.tournamentId, eventId:gf1.eventId, drawId:gf1.drawId,
    bracket:'GF', round:2, position:0, groupId:null,
    entry1Id:gf1.entry1Id, entry2Id:gf1.entry2Id, courtId:null, scheduledStart:null, estDurationMin:30,
    actualStart:null, actualEnd:null, status:'scheduled', games:[], winnerEntryId:null,
    nextMatchId:null, nextMatchSlot:null, loserNextMatchId:null, loserNextMatchSlot:null,
    isThirdPlace:false, grKind:'gf2'
  });
  await notify(gf1.tournamentId, null, 'match_scheduled', 'Bracket reset required - Grand Final game two.');
}
async function checkEventCompletion(eventId){
  const ev = eventById(eventId); if(!ev) return;
  const matches = eventMatches(eventId);
  if(!matches.length) return;
  /* Mexicano Americano generates one round at a time with no fixed round
     count, so "every match generated so far is done" doesn't mean the event
     is over - the admin decides that by not generating another round. */
  if(ev.drawFormat==='americano' && (ev.americanoVariant||'classic')==='mexicano') return;
  const gf2Pending = matches.some(m=>m.grKind==='gf2' && !['completed'].includes(m.status));
  const allDone = matches.every(m=> ['completed','bye','walkover','retired','cancelled'].includes(m.status) || (m.grKind==='gf2'));
  const decisive = matches.filter(m=> !(m.grKind==='gf1' && m.status==='completed' && m.winnerEntryId===m.entry2Id));
  const reallyDone = decisive.every(m=> ['completed','bye','walkover','retired','cancelled'].includes(m.status));
  if(reallyDone && !gf2Pending && ev.status!=='completed'){
    await Store.update('events', eventId, {status:'completed'});
    await notify(ev.tournamentId, null, 'results_published', 'Results published for ' + ev.name + '.');
  }
}

/* ---- Live scoring: point-event log keeps Undo exact ---- */
function currentGameOf(match){
  const games = match.games||[];
  if(!games.length) return {a:0,b:0,log:[]};
  const last = games[games.length-1];
  return ScoreRules.gameWinner(last) ? {a:0,b:0,log:[]} : last;
}
function gamesPlayedCount(match){
  return (match.games||[]).filter(g=>ScoreRules.gameWinner(g)).length;
}
async function addPoint(match, side){
  const cfg = scoringFor(eventById(match.eventId), tournamentById(match.tournamentId));
  let games = (match.games||[]).map(g=>({...g, log:(g.log||[]).slice()}));
  if(!games.length || ScoreRules.gameWinner(games[games.length-1], cfg)) games.push({a:0,b:0,log:[]});
  const g = games[games.length-1];
  g.log.push(side);
  const sc = ScoreRules.scoreFromLog(g.log);
  g.a = sc.a; g.b = sc.b;
  if(!ScoreRules.validGameScore(g, cfg)){ g.log.pop(); const sc2=ScoreRules.scoreFromLog(g.log); g.a=sc2.a; g.b=sc2.b; return; }
  const winner = ScoreRules.matchWinner(games, cfg);
  await act(async ()=>{
    const patch = {games, status: match.status==='scheduled'||match.status==='pending' ? 'in_progress' : match.status};
    if(!match.actualStart) patch.actualStart = nowIso();
    if(winner){
      await completeMatch({...match, games}, {status:'completed', winnerEntryId: winner===1?match.entry1Id:match.entry2Id, games});
    } else {
      await Store.update('matches', match.id, patch);
    }
  });
}
async function undoPoint(match){
  let games = (match.games||[]).map(g=>({...g, log:(g.log||[]).slice()}));
  if(!games.length) return;
  let last = games[games.length-1];
  if(ScoreRules.gameWinner(last) && games.length>1){
    // last game already decided and it's the only entry on the board (no new
    // game started yet) - undo re-opens that decided game
  }
  if(!last.log || !last.log.length){
    if(games.length>1){ games.pop(); last = games[games.length-1]; }
    else return;
  }
  last.log.pop();
  const sc = ScoreRules.scoreFromLog(last.log);
  last.a = sc.a; last.b = sc.b;
  await act(async ()=> Store.update('matches', match.id, {games, status:'in_progress', winnerEntryId:null}));
}
async function endGameManually(match){
  const games = (match.games||[]).map(g=>({...g}));
  if(!games.length) return;
  const last = games[games.length-1];
  if(last.a===last.b){ toast('Scores are tied - keep playing or edit manually', true); return; }
  games.push({a:0,b:0,log:[]});
  await act(async ()=> Store.update('matches', match.id, {games}));
}
async function endMatchDecision(match, kind, winnerEntryId){
  /* kind: 'walkover' | 'retired' - picks a winner without full score entry. */
  await completeMatch(match, {status:kind, winnerEntryId, games:match.games||[]});
}
async function cancelMatch(match, reason){
  return act(async ()=>{
    await Store.update('matches', match.id, {status:'cancelled'});
    await audit(match.tournamentId, state.role, 'match_cancelled', reason||'');
  });
}
async function correctScore(match, games){
  const cfg = scoringFor(eventById(match.eventId), tournamentById(match.tournamentId));
  const winner = ScoreRules.matchWinner(games, cfg);
  if(!winner){ toast('Corrected score does not produce a valid winner', true); return; }
  await completeMatch(match, {status:'completed', winnerEntryId: winner===1?match.entry1Id:match.entry2Id, games}, {forceCorrection:true});
}

function csvEsc(v){ v = v==null?'':String(v); if(/[",\n\r]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"'; return v; }
function toCSV(columns, rows){
  const header = columns.map(c=>csvEsc(c.label)).join(',');
  const lines = rows.map(r=> columns.map(c=> csvEsc(typeof c.get==='function'?c.get(r):r[c.key])).join(','));
  return [header, ...lines].join('\r\n');
}
async function downloadCSV(filename, csv){
  if(Native.has('sbShare')){ Native.post('sbShare', {filename, text:'\ufeff'+csv}); return; }
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8;'});
  try{
    const downloads = await claude.use('downloads');
    if(downloads){
      try{
        await downloads.save({filename, data: blob});
        return;
      }catch(err){
        if(err && err.code === 'declined') return;
        toast('Could not save the file ('+((err&&err.code)||'unknown')+').');
        return;
      }
    }
  }catch(e){}
  // Fallback: no downloads capability available in this view (e.g. previewing outside the viewer).
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
    toast('Exported ' + filename);
  }catch(e){ console.error(e); toast('Export failed', true); }
}

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function randomGame(cfg, forcedWinner){
  cfg = cfg||DEFAULT_SCORING;
  const winSide = forcedWinner || (Math.random()<0.5?1:2);
  const winScore = cfg.pointsToWin;
  const loseScore = Math.floor(Math.random()* (winScore-2)) + (Math.random()<0.3? winScore-2 : 0);
  const lose = Math.min(loseScore, winScore-2);
  return winSide===1 ? {a:winScore,b:Math.max(0,lose),log:[]} : {a:Math.max(0,lose),b:winScore,log:[]};
}
function randomMatchGames(cfg){
  cfg = cfg||DEFAULT_SCORING;
  const need = ScoreRules.gamesNeeded(cfg);
  const games=[]; let w1=0,w2=0;
  while(w1<need && w2<need){
    const side = Math.random()<0.5?1:2;
    const g = randomGame(cfg, side);
    games.push(g);
    if(side===1) w1++; else w2++;
  }
  return games;
}

/* Deterministic-ish simulated progress: schedules every playable match onto a
   court/time, completes most of them with valid random scores, and leaves a
   realistic mix behind - including exactly one live in-progress match. */
async function simulateDemoResults(tid, msId, wsId, mdId, xdId, courtIds){
  const cfg = DEFAULT_SCORING;
  const now = Date.now();
  let courtCursor = 0, timeCursor = now - 3*3600000;
  function nextSlot(){
    const court = courtIds[courtCursor % courtIds.length];
    const start = new Date(timeCursor).toISOString();
    courtCursor++;
    if(courtCursor % courtIds.length === 0) timeCursor += 40*60000;
    return {court, start};
  }
  async function scheduleAll(matches){
    for(const m of matches){
      if(m.entry1Id && m.entry2Id){
        const {court,start} = nextSlot();
        await Store.update('matches', m.id, {courtId:court, scheduledStart:start, status: m.status==='pending'?'pending':'scheduled'});
      }
    }
  }
  async function completeRandom(m, cfgLocal){
    const games = randomMatchGames(cfgLocal||cfg);
    const winner = ScoreRules.matchWinner(games, cfgLocal||cfg);
    const fresh = matchById(m.id) || m;
    await completeMatch(fresh, {status:'completed', winnerEntryId: winner===1?fresh.entry1Id:fresh.entry2Id, games}, {silent:true});
  }

  /* --- Men's Singles: complete round 1, one semifinal, leave the other
     semifinal live-in-progress, final + third place remain scheduled/TBD --- */
  let msMatches = eventMatches(msId);
  await scheduleAll(msMatches);
  const msR1 = msMatches.filter(m=>m.bracket==='SE'&&m.round===1&&!m.isThirdPlace);
  for(const m of msR1){ if(m.status!=='bye') await completeRandom(m); }
  msMatches = eventMatches(msId);
  const msSemis = msMatches.filter(m=>m.bracket==='SE'&&m.round===2&&!m.isThirdPlace).sort((a,b)=>a.position-b.position);
  if(msSemis[0]) await completeRandom(msSemis[0]);
  if(msSemis[1] && msSemis[1].entry1Id && msSemis[1].entry2Id){
    const live = matchById(msSemis[1].id);
    const g = {a:11,b:8,log:['a','a','b','a','a','a','b','a','b','b','b','a','a','a','a','a','a','a','b','b']};
    await Store.update('matches', live.id, {games:[g], status:'in_progress', actualStart:new Date(now-6*60000).toISOString(), courtId: courtIds[0], scheduledStart:new Date(now-6*60000).toISOString()});
    state._demoLiveMatchId = live.id;
  }

  /* --- Women's Singles (double elim): complete WB round 1 only --- */
  let wsMatches = eventMatches(wsId);
  await scheduleAll(wsMatches);
  const wsR1 = wsMatches.filter(m=>m.bracket==='WB'&&m.round===1);
  for(const m of wsR1){ if(m.status!=='bye') await completeRandom(m); }

  /* --- Men's Doubles (groups + knockout): finish groups, generate knockout,
     complete half of the knockout round 1 --- */
  let mdMatches = eventMatches(mdId);
  await scheduleAll(mdMatches);
  const grpMatches = mdMatches.filter(m=>m.bracket==='GRP');
  for(const m of grpMatches){ if(m.status!=='bye') await completeRandom(m); }
  const mdEventObj = {id:mdId};
  await generateKnockoutFromGroups(mdEventObj);
  let mdKO = eventMatches(mdId).filter(m=>m.bracket==='SE'&&m.round===1);
  await scheduleAll(mdKO);
  for(let i=0;i<mdKO.length;i++){ if(i%2===0 && mdKO[i].status!=='bye') await completeRandom(mdKO[i]); }

  /* --- Mixed Doubles: freshly scheduled, nothing played yet --- */
  const xdMatches = eventMatches(xdId);
  await scheduleAll(xdMatches);
}

function globalSearchResults(q){
  q = (q||'').trim().toLowerCase();
  if(!q) return null;
  const players = state.players.filter(p=>p.name.toLowerCase().includes(q)).slice(0,6);
  const tournaments = state.tournaments.filter(t=>t.name.toLowerCase().includes(q)).slice(0,4);
  const clubs = state.clubs.filter(c=>c.name.toLowerCase().includes(q)).slice(0,4);
  const events = state.events.filter(e=>e.name.toLowerCase().includes(q)).slice(0,4);
  return {players, tournaments, clubs, events};
}
function renderSearchResults(){
  if(!state.searchOpen) return '';
  const r = globalSearchResults(state.search);
  if(!r) return `<div class="search-results open"><div class="sr-empty">Start typing to search.</div></div>`;
  const total = r.players.length+r.tournaments.length+r.clubs.length+r.events.length;
  if(!total) return `<div class="search-results open"><div class="sr-empty">No matches for "${esc(state.search)}".</div></div>`;
  function group(title, items, render){
    if(!items.length) return '';
    return `<div class="sr-group"><h4>${title}</h4>${items.map(render).join('')}</div>`;
  }
  return `<div class="search-results open">
    ${group('Tournaments', r.tournaments, t=>`<button class="sr-item" data-open-tournament="${t.id}">${esc(t.name)}<div class="sr-sub">${esc(t.status)}</div></button>`)}
    ${group('Events', r.events, e=>`<button class="sr-item" data-open-tournament="${e.tournamentId}" data-open-tab="events" data-open-event-id="${e.id}">${esc(e.name)}<div class="sr-sub">${(tournamentById(e.tournamentId)||{}).name||''}</div></button>`)}
    ${group('Players', r.players, p=>`<button class="sr-item" data-open-player="${p.id}">${esc(p.name)}<div class="sr-sub">${esc((clubById(p.clubId)||{}).name||'No club')}</div></button>`)}

  </div>`;
}

function ringSvg(pct, color){
  pct = clamp(pct,0,100);
  const r=26, c=2*Math.PI*r;
  const off = c*(1-pct/100);
  return `<svg width="64" height="64" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="7"/>
    <circle cx="32" cy="32" r="${r}" fill="none" stroke="${color||'var(--court)'}" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 32 32)"/>
    <text x="32" y="37" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)">${Math.round(pct)}%</text>
  </svg>`;
}
function renderOverviewTab(t){
  const evs = tEvents(t.id);
  const matches = tMatches(t.id);
  const regs = tRegistrations(t.id);
  const courts = tCourts(t.id);
  const completed = matches.filter(m=>['completed','walkover','retired','bye'].includes(m.status));
  const live = matches.filter(m=>m.status==='in_progress');
  const scheduled = matches.filter(m=>['scheduled','called'].includes(m.status));
  const pct = matches.length ? Math.round(100*completed.length/matches.length) : 0;
  const upcoming = matches.filter(m=>m.scheduledStart && ['scheduled','called'].includes(m.status)).sort((a,b)=>a.scheduledStart.localeCompare(b.scheduledStart)).slice(0,6);
  const recent = completed.slice().sort((a,b)=>(b.actualEnd||b.updatedAt||'').localeCompare(a.actualEnd||a.updatedAt||'')).slice(0,6);
  const regByStatus = {confirmed:0, pending:0, waitlisted:0, withdrawn:0, rejected:0};
  regs.forEach(r=> regByStatus[r.status] = (regByStatus[r.status]||0)+1);
  const roleTabs = tabsForRole().map(x=>x[0]);
  const go = k => roleTabs.includes(k) ? `data-tab="${k}" role="button"` : '';
  return `
    <div class="stat-grid">
      <div class="stat-tile accent" ${go('players')}><div class="stat-num">${new Set(regs.map(r=>r.playerId)).size}</div><div class="stat-label">Registered players</div></div>
      <div class="stat-tile" ${go('events')}><div class="stat-num">${evs.length}</div><div class="stat-label">Events</div></div>
      <div class="stat-tile gold" ${go('matches')}><div class="stat-num">${live.length}</div><div class="stat-label">Live matches</div></div>
      <div class="stat-tile" ${go('schedule')}><div class="stat-num">${scheduled.length}</div><div class="stat-label">Scheduled</div></div>
      <div class="stat-tile" ${go('results')}><div class="stat-num">${completed.length}/${matches.length}</div><div class="stat-label">Completed</div></div>
      <div class="stat-tile" ${go('courts')}><div class="stat-num">${courts.filter(c=>c.active).length}/${courts.length}</div><div class="stat-label">Courts active</div></div>
    </div>
    <div class="section-h"><h3>Match progress</h3></div>
    <div class="ring-wrap">${ringSvg(pct)}<div class="ring-label"><strong>${completed.length} of ${matches.length} matches played</strong>${live.length? live.length+' live right now':'No live matches right now'}</div></div>
    <div class="section-h"><h3>Registration status</h3></div>
    ${Object.entries(regByStatus).map(([k,v])=>`<div class="bar-row"><span class="bar-label">${esc(k)}</span><div class="bar-track"><div class="bar-fill" style="width:${regs.length?Math.round(100*v/regs.length):0}%"></div></div><span class="bar-num">${v}</span></div>`).join('')}
    <div class="section-h"><h3>Upcoming matches</h3></div>
    ${upcoming.length ? upcoming.map(renderMatchListRow).join('') : `<div class="empty-tab">Nothing scheduled yet.</div>`}
    <div class="section-h"><h3>Recent results</h3></div>
    ${recent.length ? recent.map(renderMatchListRow).join('') : `<div class="empty-tab">No results yet.</div>`}
  `;
}
function winnerLabel(m){
  if(!['completed','walkover','retired'].includes(m.status) || !m.winnerEntryId) return '';
  const w = entryById(m.winnerEntryId);
  return w ? esc(entryName(w)) + ' won' : '';
}
function renderMatchListRow(m){
  const ev = eventById(m.eventId);
  const e1 = entryById(m.entry1Id), e2 = entryById(m.entry2Id);
  const score = (m.games||[]).map(g=>g.a+'-'+g.b).join(', ');
  const court = courtById(m.courtId);
  const wl = winnerLabel(m);
  return `<div class="list-row" data-open-match="${m.id}">
    <span class="pill">${esc((ev||{}).name||'')}</span>
    <span class="grow"><span class="main-txt">${e1&&m.winnerEntryId===e1.id?'<b>'+esc(entryName(e1))+'</b>':esc(entryName(e1))} <span style="color:var(--faint)">vs</span> ${e2&&m.winnerEntryId===e2.id?'<b>'+esc(entryName(e2))+'</b>':esc(entryName(e2))}</span>

/* ---------- DRAWS TAB / BRACKET RENDERING ---------- */
function renderBracketColumns(matches, containerId, editable){
  if(!matches.length) return `<div class="empty-tab">No matches in this bracket yet.</div>`;
  const byRoundPos = {};
  matches.forEach(m=>{ (byRoundPos[m.round]=byRoundPos[m.round]||[]).push(m); });
  const roundNums = Object.keys(byRoundPos).map(Number).sort((a,b)=>a-b);
  const maxRound = roundNums.length?Math.max(...roundNums):0;
  const cols = roundNums.map(r=>{
    const ms = byRoundPos[r].slice().sort((a,b)=>a.position-b.position);
    const cards = ms.map(m=>renderMatchCard(m, maxRound, editable)).join('');
    return `<div class="round-col"><div class="round-label">${esc(roundLabelFor(ms[0].bracket, r, maxRound, ms[0].isThirdPlace))}</div>${cards}</div>`;
  }).join('');
  return `<div class="bracket-wrap"><div class="bracket" id="${containerId}"><svg class="bracket-lines" id="${containerId}Lines"></svg>${cols}</div></div>`;
}
function renderMatchCard(m, maxRound, editable){
  const e1=entryById(m.entry1Id), e2=entryById(m.entry2Id);

  return `<div class="match-card ${playable&&editable?'playable':''}" data-match-id="${m.id}" ${m.nextMatchId?`data-next="${m.nextMatchId}"`:''} ${playable&&editable?`data-open-live="${m.id}"`:''} ${!playable?`data-open-match="${m.id}"`:''}>
    <div class="m-slot ${!e1?'tbd':''} ${w&&w===m.entry1Id?'winner':''}"><span class="name">${e1?esc(entryName(e1)):'TBD'}</span>${e1&&m.games&&m.games.length?`<span class="score mono">${m.games.map(g=>g.a).join('-')}</span>`:''}</div>
    <div class="m-slot ${!e2?'tbd':''} ${w&&w===m.entry2Id?'winner':''}"><span class="name">${e2?esc(entryName(e2)):'TBD'}</span>${e2&&m.games&&m.games.length?`<span class="score mono">${m.games.map(g=>g.b).join('-')}</span>`:''}</div>
    <div class="m-status ${m.status==='bye'?'bye':''} ${m.status==='in_progress'?'live':''}">${m.status==='bye'?'Bye':m.status==='in_progress'?'Live':m.status==='completed'?'Final':m.status==='walkover'?'Walkover':(m.scheduledStart?esc(fmtTime(m.scheduledStart)):'TBD')}</div>

function renderStandingsTable(rows){

function renderRoundRobinMatchList(matches, editable, sitOutByRound){

function renderBracketForEvent(ev, editable){

    return `<div class="bracket-section wb"><h4>Winners bracket</h4>${renderBracketColumns(wb,'bracketWB',editable)}</div>
      <div class="bracket-section lb"><h4>Losers bracket</h4>${renderBracketColumns(lb,'bracketLB',editable)}</div>

  }
  if(draw.format==='americano'){
    const individualEntries = eventEntries(ev.id).filter(e=>!e.isAmericanoTeam);

    const standingsHtml = (ev.americanoVariant==='mixed')
      ? `<div class="group-grid">

          <div class="group-card card"><h4>Women</h4>${renderAmericanoStandingsTable(standing.filter(r=>{const p=playerById(r.playerId); return p&&p.gender==='female';}))}</div>
        </div>`
      : renderAmericanoStandingsTable(standing);
    const canAdd = editable && state.role==='admin' && (ev.americanoVariant||'classic')!=='mexicano';
    return standingsHtml + `<div class="section-h"><h3>Matches</h3>${canAdd?`<button class="btn btn-sm no-print" data-add-am-rounds="${ev.id}">${ICONS.plus} Add rounds</button>`:''}</div>` + renderRoundRobinMatchList(matches, editable, draw.americanoSitOut);
  }
  return renderBracketColumns(matches.filter(m=>m.bracket==='SE'), 'bracketMain', editable);
}

function drawBracketConnectorsFor(containerId){
  const container = document.getElementById(containerId);
  const svg = document.getElementById(containerId+'Lines');
  if(!container||!svg) return;
  const w=container.scrollWidth, h=container.scrollHeight;
  svg.setAttribute('width',w); svg.setAttribute('height',h); svg.style.width=w+'px'; svg.style.height=h+'px';
  svg.innerHTML='';
  const rect0 = container.getBoundingClientRect();
  container.querySelectorAll('.match-card[data-next]').forEach(card=>{
    const nextId = card.getAttribute('data-next');
    const nextCard = container.querySelector('.match-card[data-match-id="'+nextId+'"]');
    if(!nextCard) return;
    const r1=card.getBoundingClientRect(), r2=nextCard.getBoundingClientRect();
    const x1=r1.right-rect0.left, y1=r1.top+r1.height/2-rect0.top;
    const x2=r2.left-rect0.left, y2=r2.top+r2.height/2-rect0.top;
    const midX=(x1+x2)/2;
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', `M ${x1} ${y1} H ${midX} V ${y2} H ${x2}`);
    svg.appendChild(path);
  });
}
function drawAllBracketConnectors(){
  ['bracketMain','bracketWB','bracketLB'].forEach(id=>{ if(document.getElementById(id)) drawBracketConnectorsFor(id); });
}
window.addEventListener('resize', ()=>{ requestAnimationFrame(drawAllBracketConnectors); });

function applyMatchFilters(matches, f){
  f = f||{};
  return matches.filter(m=>{
    if(f.eventId && m.eventId!==f.eventId) return false;
    if(f.courtId && m.courtId!==f.courtId) return false;
    if(f.status && m.status!==f.status) return false;
    if(f.date && (!m.scheduledStart || m.scheduledStart.slice(0,10)!==f.date)) return false;
    if(f.player){
      const q=f.player.toLowerCase();
      const names = matchEntryPlayerIds(m).map(pid=>playerName(pid).toLowerCase());
      if(!names.some(n=>n.includes(q))) return false;
    }
    return true;
  });
}

    ${opts.status!==false?`<select data-filter="${key}.status"><option value="">All statuses</option>${['scheduled','called','in_progress','completed','walkover','retired','cancelled','postponed','pending','bye'].map(s=>`<option value="${s}" ${f.status===s?'selected':''}>${esc(s)}</option>`).join('')}</select>`:''}

    <span class="pill">${esc((ev||{}).name||'')}</span>

      <div class="sub-txt">${esc(roundLabelForMatch(m))}${court?' &middot; '+esc(court.name):''}${m.scheduledStart?' &middot; '+esc(fmtDateTime(m.scheduledStart)):''}${wl?' &middot; <span style="color:var(--court);font-weight:600">'+wl+'</span>':''}</div></span>
    ${score?`<span class="mono sub-txt">${esc(score)}</span>`:''}

    ${state.role==='admin' ? `<div class="row no-print" style="gap:6px">

    </div>` : ''}
  </div>`;
}

/* ---------- SCHEDULE TAB ---------- */
function renderScheduleTab(t){
  const f = state.filters.schedule = state.filters.schedule||{};
  const matches = applyMatchFilters(tMatches(t.id), f).filter(m=>m.scheduledStart);
  const courts = tCourts(t.id).filter(c=>c.active);
  const times = [...new Set(matches.map(m=>m.scheduledStart))].sort();
  const grid = {};
  matches.forEach(m=>{ (grid[m.scheduledStart]=grid[m.scheduledStart]||{})[m.courtId]=m; });
  return `
    ${renderFilterBar(t,'schedule',{status:false})}
    <div class="export-row no-print"><button class="btn btn-sm" id="btnExportCourtSchedule">${ICONS.download} Export CSV</button><button class="btn btn-sm" id="btnPrintSchedule">${ICONS.print} Print</button>
      ${state.role==='admin'?`<button class="btn btn-sm btn-primary" id="btnAssignAny">${ICONS.calendar} Schedule a match&hellip;</button>`:''}</div>
    ${!times.length ? `<div class="empty-tab">Nothing scheduled yet.</div>` : `
    <div class="sched-list">${times.map(time=>`<div class="sched-list-time">${esc(fmtDateTime(time))}</div>${courts.map(c=>{
      const m = grid[time] && grid[time][c.id];
      if(!m) return '';
      return `<div class="list-row ${m.status==='in_progress'?'live':''}" data-open-match="${m.id}">
        <span class="pill">${esc(c.name)}</span>
        <span class="grow"><span class="main-txt">${esc(entryName(entryById(m.entry1Id)))} <span style="color:var(--faint)">vs</span> ${esc(entryName(entryById(m.entry2Id)))}</span>
          <div class="sub-txt">${esc(eventById(m.eventId)?.name||'')}</div></span>
        ${matchStatusPill(m)}
      </div>`;
    }).join('')}`).join('')}</div>
    <div class="sched-scroll"><table class="sched-grid"><thead><tr><th>Time</th>${courts.map(c=>`<th>${esc(c.name)}</th>`).join('')}</tr></thead>
    <tbody>${times.map(time=>`<tr><td class="sched-time-col">${esc(fmtDateTime(time))}</td>${courts.map(c=>{
      const m = grid[time] && grid[time][c.id];
      if(!m) return '<td></td>';
      return `<td><div class="sched-cell-match ${m.status==='in_progress'?'live':''}" data-open-match="${m.id}">
        <div style="font-weight:700">${esc(eventById(m.eventId)?.name||'')}</div>
        <div>${esc(entryName(entryById(m.entry1Id)))} vs ${esc(entryName(entryById(m.entry2Id)))}</div>
        ${matchStatusPill(m)}
      </div></td>`;
    }).join('')}</tr>`).join('')}</tbody></table></div>`}
  `;
}

/* ---------- RESULTS TAB ---------- */
function renderResultsTab(t){
  const evs = tEvents(t.id);
  return `
    <div class="export-row no-print"><button class="btn btn-sm" id="btnExportResultsMain">${ICONS.download} Export all results CSV</button><button class="btn btn-sm" id="btnPrintResults">${ICONS.print} Print</button></div>
    ${evs.map(ev=>renderEventResultsCard(ev)).join('') || `<div class="empty-tab">No events yet.</div>`}
  `;
}
function renderEventResultsCard(ev){
  const draw = eventDraw(ev.id);
  if(!draw) return `<div class="card"><h3 style="font-family:'Public Sans';font-size:15px;text-transform:none;letter-spacing:0">${esc(ev.name)}</h3><div class="sub-txt">Draw not generated yet.</div></div>`;
  const placements = computeEventPlacements(ev.id);
  const ranked = eventEntries(ev.id).filter(e=>!e.isAmericanoTeam).map(e=>({entry:e, ...(placements[e.id]||{points:0,label:'In progress'})})).sort((a,b)=>b.points-a.points);
  const podium = ranked.filter(r=>['Champion','Runner-up'].includes(r.label) || /^#[123]/.test(r.label)).slice(0,4);
  return `<div class="card">
    <div class="row between wrap"><h3 style="font-family:'Public Sans';font-size:15px;text-transform:none;letter-spacing:0;margin:0">${esc(ev.name)}</h3>
      <button class="btn btn-sm no-print" data-export-standings="${ev.id}">${ICONS.download} Export</button></div>
    <div class="row wrap" style="margin:8px 0;gap:8px">
      ${podium.map(r=>`<span class="pill ${r.label==='Champion'?'gold':'court'}">${esc(r.label)}: ${esc(entryName(r.entry))}</span>`).join('') || '<span class="sub-txt">Still in progress.</span>'}
    </div>
    <div class="table-scroll"><table class="data-table"><thead><tr><th>Entry</th><th>Placement</th><th class="num">Points</th></tr></thead>
    <tbody>${ranked.map(r=>`<tr><td>${esc(entryName(r.entry))}</td><td>${esc(r.label)}</td><td class="num mono">${r.points}</td></tr>`).join('')}</tbody></table></div>
  </div>`;
}

/* ---------- PLAYER-ROLE TABS (within a tournament) ---------- */
function renderRegisterTab(t){
  const me = myPlayer();
  if(!me) return `<div class="empty-tab">Pick a player profile from the role switcher (top right) to register.</div>`;
  const evs = tEvents(t.id).filter(e=> !['completed','cancelled'].includes(e.status));
  const myRegs = state.registrations.filter(r=>r.playerId===me.id && r.tournamentId===t.id);
  return `
    <div class="helptext" style="margin-bottom:10px">Registering as <strong>${esc(me.name)}</strong>.</div>
    ${evs.map(ev=>{
      const reg = myRegs.find(r=>r.eventId===ev.id && r.status!=='withdrawn' && r.status!=='rejected');
      const doubles = isDoublesType(ev.type);
      if(reg){
        return `<div class="list-row"><span class="grow main-txt">${esc(ev.name)}</span>${regStatusPill(reg.status)}
          ${reg.status!=='withdrawn'?`<button class="btn btn-sm btn-danger" data-withdraw-reg="${reg.id}">Withdraw</button>`:''}</div>`;
      }
      const otherPlayers = state.players.filter(p=>p.id!==me.id).sort((a,b)=>a.name.localeCompare(b.name));
      return `<div class="list-row wrap">
        <span class="grow main-txt">${esc(ev.name)} <span class="sub-txt">${esc(ev.type.replace(/_/g,' '))}</span></span>
        ${doubles?`<select data-partner-select="${ev.id}" style="min-width:160px"><option value="">Choose partner&hellip;</option>${otherPlayers.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>`:''}
        <button class="btn btn-sm btn-primary" data-register-event="${ev.id}">Register</button>
      </div>`;
    }).join('') || `<div class="empty-tab">No open events right now.</div>`}
  `;
}
function renderMyMatchesInTournamentTab(t){
  const me = myPlayer();
  if(!me) return `<div class="empty-tab">Pick a player profile from the role switcher to see your matches.</div>`;
  const myEntryIds = new Set(tEntries(t.id).filter(e=> entryPlayerIds(e).includes(me.id)).map(e=>e.id));
  const matches = tMatches(t.id).filter(m=> myEntryIds.has(m.entry1Id)||myEntryIds.has(m.entry2Id));
  matches.sort((a,b)=>(a.scheduledStart||'9999').localeCompare(b.scheduledStart||'9999'));
  return matches.length ? matches.map(renderMatchListRow).join('') : `<div class="empty-tab">No matches yet for ${esc(me.name)} in this tournament.</div>`;
}
function renderLiveInTournamentTab(t){
  const live = tMatches(t.id).filter(m=>m.status==='in_progress');
  return live.length ? live.map(m=>renderPublicLiveCard(m)).join('') : `<div class="empty-tab">No matches live right now.</div>`;
}
function renderPublicLiveCard(m){
  const ev = eventById(m.eventId), court = courtById(m.courtId);
  const e1=entryById(m.entry1Id), e2=entryById(m.entry2Id);
  const g = m.games && m.games.length ? m.games[m.games.length-1] : {a:0,b:0};
  const priorGames = (m.games||[]).slice(0,-1);
  return `<div class="card" data-open-match="${m.id}">
    <div class="row between"><span class="pill live">&#9679; LIVE</span><span class="pill">${esc((court||{}).name||'Court TBD')}</span></div>
    <div class="sub-txt" style="margin:4px 0">${esc((ev||{}).name||'')} &middot; ${esc(roundLabelForMatch(m))}</div>
    <div class="row between" style="font-weight:700;font-size:15px"><span>${esc(entryName(e1))}</span><span class="mono" style="font-size:20px">${g.a}&ndash;${g.b}</span><span>${esc(entryName(e2))}</span></div>
    ${priorGames.length?`<div class="live-games-strip" style="margin-top:6px">${priorGames.map(pg=>`<span class="live-game-chip mono">${pg.a}-${pg.b}</span>`).join('')}</div>`:''}
  </div>`;
}
function renderTournamentPlayersTab(t){
  if(state.role==='admin') return renderAdminTournamentPlayersTab(t);
  const regs = tRegistrations(t.id).filter(r=>r.status==='confirmed');
  const pids = [...new Set(regs.map(r=>r.playerId).concat(regs.map(r=>r.partnerId).filter(Boolean)))];
  const players = pids.map(playerById).filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name));
  return renderPlayerCards(players);
}
/* Admin's tournament-scoped "Players" tab: create a brand-new player profile
   and/or register an existing one into one of this tournament's events,
   without leaving the tournament. */
function renderAdminTournamentPlayersTab(t){
  const evs = tEvents(t.id);
  const regs = tRegistrations(t.id).filter(r=>r.status!=='withdrawn' && r.status!=='rejected');
  const byPlayer = {};
  regs.forEach(r=>{
    const ev = eventById(r.eventId); if(!ev) return;
    (byPlayer[r.playerId]=byPlayer[r.playerId]||[]).push(ev.name);
    if(r.partnerId) (byPlayer[r.partnerId]=byPlayer[r.partnerId]||[]).push(ev.name);
  });
  const players = Object.keys(byPlayer).map(playerById).filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name));
  const allPlayersSorted = state.players.slice().sort((a,b)=>a.name.localeCompare(b.name));
  return `
    <div class="row between wrap" style="margin-bottom:12px">
      <div class="helptext">${players.length} player${players.length===1?'':'s'} registered in this tournament</div>
      <button class="btn btn-sm" id="btnNewPlayerFromTournament">${ICONS.plus} New player profile</button>
    </div>
    ${evs.length ? `<div class="card" style="margin-bottom:14px">
      <div class="sub-txt" style="margin-bottom:6px;font-weight:700">Add a player to this tournament</div>
      <div class="row wrap" style="gap:8px">
        <select id="fTPlayerAddEvent" style="min-width:150px"><option value="">Choose event&hellip;</option>${evs.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select>
        <select id="fTPlayerAddPlayer" style="min-width:150px"><option value="">Choose player&hellip;</option>${allPlayersSorted.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
        <select id="fTPlayerAddPartner" style="min-width:150px"><option value="">No partner (singles)</option>${allPlayersSorted.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
        <button class="btn btn-primary btn-sm" id="btnTournamentAddPlayer">${ICONS.plus} Add to event</button>
      </div>
      <div class="helptext" style="margin-top:6px">Registers the player directly and confirms it immediately. Need a player who isn't in the system yet? Use "New player profile" first.</div>
    </div>` : `<div class="helptext" style="margin-bottom:14px">Add an event first (Events tab), then players can be registered into it.</div>`}
    ${players.length ? `<div class="cat-grid">${players.map(p=>`<div class="cat-card" data-open-player="${p.id}">
      <div class="row" style="margin-bottom:6px"><div class="avatar">${p.photoUrl?`<img src="${esc(p.photoUrl)}" alt="">`:esc((p.name||'?').slice(0,1))}</div>
      <div><h3 style="margin:0">${esc(p.name)}</h3><div class="sub-txt">${esc((clubById(p.clubId)||{}).name||'No club')}</div></div></div>
      <div class="cat-meta">${(byPlayer[p.id]||[]).map(n=>`<span class="pill">${esc(n)}</span>`).join('')}</div>
    </div>`).join('')}</div>` : `<div class="empty-tab">No players registered yet. Add one above.</div>`}
  `;
}
function renderPlayerCards(players){
  if(!players.length) return `<div class="empty-tab">No players to show.</div>`;
  return `<div class="cat-grid">${players.map(p=>`<div class="cat-card" data-open-player="${p.id}">
    <div class="row" style="margin-bottom:6px"><div class="avatar">${p.photoUrl?`<img src="${esc(p.photoUrl)}" alt="">`:esc((p.name||'?').slice(0,1))}</div>
    <div><h3 style="margin:0">${esc(p.name)}</h3><div class="sub-txt">${esc((clubById(p.clubId)||{}).name||'No club')}</div></div></div>
    <div class="cat-meta"><span class="pill">${esc(p.skillLevel||'')}</span><span class="pill">${esc(p.gender||'')}</span></div>
  </div>`).join('')}</div>`;
}

/* ---------- GLOBAL: RANKINGS ---------- */
function renderRankingsView(){
  const f = state.filters.rankings = state.filters.rankings||{};

  if(f.clubId) stats = stats.filter(s=> (s.player||{}).clubId===f.clubId);

    <tbody>${stats.map((s,i)=>`<tr class="rank-${i+1}"><td class="rk mono">${i+1}</td><td>${esc((s.player||{}).name||'Unknown')}</td><td class="num mono">${s.rankingPoints}</td>

}

/* A page inside the artifact viewer's sandboxed frame cannot rely on the
   browser's native confirm()/alert()/prompt() — some hosts block them
   outright (the call throws or silently no-ops), which would make every
   "Delete" button look like it does nothing. This is a real in-page dialog
   instead, so it always shows and always resolves. */
function confirmDialog(message, opts){
  opts = opts||{};
  const dlg = document.getElementById('dlgConfirm');
  document.getElementById('confirmTitle').textContent = opts.title || 'Are you sure?';
  document.getElementById('confirmMsg').textContent = message;
  const okBtn = document.getElementById('confirmOk');
  okBtn.textContent = opts.okLabel || 'Delete';
  okBtn.className = 'btn ' + (opts.danger===false ? 'btn-primary' : 'btn-danger');
  return new Promise(resolve=>{
    let done=false;
    function finish(v){ if(done) return; done=true; dlg.removeEventListener('cancel', onCancel); if(dlg.open) dlg.close(); resolve(v); }
    function onCancel(e){ e.preventDefault(); finish(false); }
    okBtn.onclick = ()=>finish(true);
    document.getElementById('confirmCancel').onclick = ()=>finish(false);
    dlg.addEventListener('cancel', onCancel);
    if(!dlg.open) dlg.showModal();
  });
}
function stdFoot(saveId, saveLabel){
  return `<button type="button" class="btn" data-close>Cancel</button><button type="button" class="btn btn-primary" id="${saveId}">${saveLabel||'Save'}</button>`;
}

/* ---------- CUSTOM DATE PICKER ----------
   Native <input type=date> pickers render as a browser-chrome popup that gets
   clipped by the scrolling dialog body (.dlg-body{overflow-y:auto}) in some
   browsers, and behave inconsistently inside a top-layer <dialog>. This is a
   small self-contained calendar widget instead: a text input (still just
   holding a plain YYYY-MM-DD string in .value, so every existing read of
   .value keeps working unchanged) plus a popover calendar. */
function dateFieldHtml(id, value, placeholder){
  return `<div class="date-field"><input type="text" class="date-input" id="${id}" data-datepicker readonly value="${esc(value||'')}" placeholder="${placeholder||'Select date'}" autocomplete="off">${ICONS.calendar.replace('<svg ', '<svg class="date-ic" ')}</div>`;
}
function dpYmd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dpParse(s){ const m = s && /^(\d{4})-(\d{2})-(\d{2})$/.exec(s); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }
const dpState = {input:null};
function dpClose(){
  const pop = document.getElementById('dpPopover');
  if(pop) pop.remove();
  document.removeEventListener('mousedown', dpOutsideHandler, true);
  window.removeEventListener('resize', dpReposition);
  document.removeEventListener('scroll', dpReposition, true);
  dpState.input = null;
}
function dpOutsideHandler(e){
  const pop = document.getElementById('dpPopover');
  if(pop && !pop.contains(e.target) && e.target!==dpState.input) dpClose();
}
function dpReposition(){
  const pop = document.getElementById('dpPopover');
  if(!pop || !dpState.input) return;
  const r = dpState.input.getBoundingClientRect();
  if(r.bottom < 0 || r.top > window.innerHeight){ dpClose(); return; }
  const popH = pop.offsetHeight||300, popW = pop.offsetWidth||264;
  let top = r.bottom + 6; if(top + popH > window.innerHeight - 8) top = Math.max(8, r.top - popH - 6);
  let left = r.left; if(left + popW > window.innerWidth - 8) left = Math.max(8, window.innerWidth - popW - 8);
  pop.style.top = top+'px'; pop.style.left = left+'px';
}
function dpRenderGrid(){
  const {viewYear, viewMonth, input} = dpState;
  const first = new Date(viewYear, viewMonth, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  const selected = dpParse(input.value);
  const todayStr = dpYmd(new Date());
  let cells = '';
  for(let i=0;i<startDow;i++) cells += '<div class="dp-cell dp-empty"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const iso = dpYmd(new Date(viewYear, viewMonth, d));
    const isSel = selected && iso===dpYmd(selected);
    const isToday = iso===todayStr;
    cells += `<div class="dp-cell"><button type="button" class="dp-day ${isSel?'dp-sel':''} ${isToday&&!isSel?'dp-today':''}" data-dp-day="${iso}">${d}</button></div>`;
  }
  const monthName = first.toLocaleDateString(undefined,{month:'long', year:'numeric'});
  return `<div class="dp-head"><button type="button" class="icon-btn" data-dp-nav="-1">&lsaquo;</button><span class="dp-month">${esc(monthName)}</span><button type="button" class="icon-btn" data-dp-nav="1">&rsaquo;</button></div>
    <div class="dp-dow">${['S','M','T','W','T','F','S'].map(d=>`<span>${d}</span>`).join('')}</div>
    <div class="dp-grid">${cells}</div>
    <div class="dp-foot"><button type="button" class="btn btn-sm" data-dp-today="1">Today</button><button type="button" class="btn btn-sm" data-dp-clear="1">Clear</button></div>`;
}
function dpOpen(input){
  if(dpState.input===input) return;
  dpClose();
  dpState.input = input;
  const base = dpParse(input.value) || new Date();
  dpState.viewYear = base.getFullYear(); dpState.viewMonth = base.getMonth();
  const pop = document.createElement('div');
  pop.id='dpPopover'; pop.className='dp-popover';
  pop.innerHTML = dpRenderGrid();
  (input.closest('dialog') || document.body).appendChild(pop);
  dpReposition();
  pop.addEventListener('click', dpPopoverClick);
  setTimeout(()=>{
    document.addEventListener('mousedown', dpOutsideHandler, true);
    window.addEventListener('resize', dpReposition);
    document.addEventListener('scroll', dpReposition, true);
  }, 0);
}
function dpSetValue(iso){
  const input = dpState.input;
  input.value = iso;
  input.dispatchEvent(new Event('change', {bubbles:true}));
  dpClose();
}
function dpPopoverClick(e){
  const day = e.target.closest('[data-dp-day]'); if(day){ dpSetValue(day.getAttribute('data-dp-day')); return; }
  const nav = e.target.closest('[data-dp-nav]');
  if(nav){
    dpState.viewMonth += parseInt(nav.getAttribute('data-dp-nav'),10);
    if(dpState.viewMonth<0){ dpState.viewMonth=11; dpState.viewYear--; }
    if(dpState.viewMonth>11){ dpState.viewMonth=0; dpState.viewYear++; }
    const pop = document.getElementById('dpPopover'); pop.innerHTML = dpRenderGrid(); dpReposition();
    return;
  }
  if(e.target.closest('[data-dp-today]')){ dpSetValue(dpYmd(new Date())); return; }
  if(e.target.closest('[data-dp-clear]')){ dpSetValue(''); return; }
}
document.addEventListener('focusin', e=>{ if(e.target.matches && e.target.matches('[data-datepicker]')) dpOpen(e.target); });
document.addEventListener('click', e=>{ if(e.target.matches && e.target.matches('[data-datepicker]')) dpOpen(e.target); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && dpState.input) dpClose(); });
