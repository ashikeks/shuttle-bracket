<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shuttle Bracket</title>
<meta name="description" content="Badminton tournament management: registrations, seeded draws, live scoring, scheduling and rankings.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#f4f6f2; --surface:#ffffff; --surface-2:#eaeee5; --border:#dde3d7;
    --ink:#12201b; --muted:#5c6f66; --faint:#8a9a91;
    --court:#0e6e57; --court-ink:#ffffff; --court-soft:#e4f1ec;
    --gold:#c8891a; --gold-soft:#faf0dc;
    --danger:#b6402c; --danger-soft:#fbe9e5;
    --live:#c8891a;
    --shadow: 0 1px 2px rgba(18,32,27,.06), 0 8px 24px rgba(18,32,27,.06);
    --radius: 14px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b1310; --surface:#121b17; --surface-2:#182620; --border:#25352c;
      --ink:#eaf2ee; --muted:#93a89e; --faint:#5f7267;
      --court:#33c79b; --court-ink:#06140f; --court-soft:#122a22;
      --gold:#f0c14e; --gold-soft:#241d0e;
      --danger:#ef7a67; --danger-soft:#2a1712;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b1310; --surface:#121b17; --surface-2:#182620; --border:#25352c;
    --ink:#eaf2ee; --muted:#93a89e; --faint:#5f7267;
    --court:#33c79b; --court-ink:#06140f; --court-soft:#122a22;
    --gold:#f0c14e; --gold-soft:#241d0e;
    --danger:#ef7a67; --danger-soft:#2a1712;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Public Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4,.display{
    font-family:"Big Shoulders Display","Public Sans",sans-serif;
    font-weight:800; letter-spacing:.01em; text-transform:uppercase; text-wrap:balance;
    margin:0;
  }
  .mono, .score-num, .stat-num{ font-family:"JetBrains Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; }
  a{color:inherit}
  button{font:inherit}
  input,select,textarea{font:inherit}
  ::selection{background:var(--court); color:var(--court-ink)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}

  .shell{ max-width:1280px; margin:0 auto; padding:0 16px 60px; }

  /* ---------- top bar ---------- */
  .topbar{ display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--border); margin-bottom:16px; flex-wrap:wrap; position:sticky; top:0; background:var(--bg); z-index:30; }
  .brand{ display:flex; align-items:center; gap:9px; flex:none; }
  .brand-mark{ width:32px; height:32px; border-radius:9px; background:var(--court); color:var(--court-ink); display:flex; align-items:center; justify-content:center; flex:none; }
  .brand-mark svg{ width:19px; height:19px; }
  .brand-name{ font-size:18px; line-height:1; }
  .brand-name .accent{ color:var(--court); }
  .topbar-spacer{ flex:1; min-width:6px; }
  .topbar-group{ display:flex; align-items:center; gap:6px; }

  .role-switch{ position:relative; }
  .role-btn{ display:flex; align-items:center; gap:6px; border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:10px; padding:7px 10px; font-size:12.5px; font-weight:700; cursor:pointer; }
  .role-btn svg{ width:14px; height:14px; }
  .role-menu{ position:absolute; right:0; top:calc(100% + 6px); background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); padding:8px; width:250px; z-index:40; display:none; }
  .role-menu.open{ display:block; }
  .role-menu h4{ font-size:10.5px; letter-spacing:.08em; color:var(--muted); text-transform:uppercase; font-family:inherit; font-weight:700; padding:4px 6px; }
  .role-opt{ width:100%; text-align:left; border:none; background:transparent; padding:8px 8px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; color:var(--ink); display:flex; align-items:center; justify-content:space-between; }
  .role-opt:hover{ background:var(--surface-2); }
  .role-opt.active{ background:var(--court-soft); color:var(--court); }
  .role-menu select{ width:100%; margin-top:6px; border:1px solid var(--border); background:var(--bg); color:var(--ink); border-radius:8px; padding:8px; }
  .role-menu .hint{ font-size:11px; color:var(--faint); padding:6px 6px 2px; }

  .icon-toggle-btn{ position:relative; appearance:none; border:1px solid var(--border); background:var(--surface); color:var(--muted); width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .icon-toggle-btn:hover{ color:var(--ink); background:var(--surface-2); }
  .icon-toggle-btn svg{ width:16px; height:16px; }
  .badge-dot{ position:absolute; top:-3px; right:-3px; min-width:15px; height:15px; padding:0 3px; border-radius:999px; background:var(--gold); color:#1a1206; font-size:9.5px; font-weight:800; display:flex; align-items:center; justify-content:center; }

  .theme-toggle{ display:flex; gap:2px; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:2px; }
  .theme-toggle button{ border:none; background:transparent; color:var(--muted); width:28px; height:28px; border-radius:999px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .theme-toggle button.active{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }
  .theme-toggle svg{ width:14px; height:14px; }

  .search-wrap{ position:relative; }
  .search-box{ display:flex; align-items:center; gap:6px; border:1px solid var(--border); background:var(--surface); border-radius:10px; padding:0 10px; height:34px; width:190px; }
  .search-box svg{ width:14px; height:14px; color:var(--faint); flex:none; }
  .search-box input{ border:none; background:none; outline:none; color:var(--ink); font-size:13px; width:100%; }
  .search-results{ position:absolute; left:0; top:calc(100% + 6px); width:320px; max-width:80vw; background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); max-height:60vh; overflow-y:auto; z-index:40; display:none; }
  .search-results.open{ display:block; }
  .sr-group h4{ font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding:8px 12px 2px; font-family:inherit; font-weight:700; }
  .sr-item{ display:block; width:100%; text-align:left; border:none; background:none; padding:8px 12px; font-size:13px; cursor:pointer; color:var(--ink); }
  .sr-item:hover{ background:var(--surface-2); }
  .sr-item .sr-sub{ color:var(--muted); font-size:11.5px; }
  .sr-empty{ padding:16px 12px; color:var(--faint); font-size:12.5px; text-align:center; }

  .notif-panel{ position:absolute; right:0; top:calc(100% + 6px); width:340px; max-width:88vw; background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); max-height:70vh; overflow-y:auto; z-index:40; display:none; }
  .notif-panel.open{ display:block; }
  .notif-head{ display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface); }
  .notif-head h4{ font-size:13px; font-family:inherit; font-weight:700; text-transform:none; letter-spacing:0; }
  .notif-item{ padding:10px 12px; border-bottom:1px solid var(--border); font-size:12.5px; display:flex; gap:8px; cursor:pointer; }
  .notif-item:last-child{ border-bottom:none; }
  .notif-item:hover{ background:var(--surface-2); }
  .notif-item.unread{ background:var(--court-soft); }
  .notif-dot{ width:7px; height:7px; border-radius:50%; background:var(--court); flex:none; margin-top:5px; }
  .notif-item.unread .notif-dot{ background:var(--gold); }
  .notif-item:not(.unread) .notif-dot{ background:transparent; }
  .notif-body p{ margin:0; }
  .notif-time{ color:var(--faint); font-size:11px; }

  /* ---------- primary nav ---------- */
  .primary-nav{ display:flex; gap:4px; flex-wrap:wrap; background:var(--surface-2); padding:4px; border-radius:12px; margin-bottom:16px; }
  .primary-nav button{ border:none; background:transparent; padding:8px 13px; border-radius:9px; font-weight:700; font-size:12px; letter-spacing:.03em; text-transform:uppercase; color:var(--muted); cursor:pointer; white-space:nowrap; }
  .primary-nav button.active{ background:var(--surface); color:var(--court); box-shadow:var(--shadow); }

  /* ---------- buttons ---------- */
  .btn{ appearance:none; border:1px solid var(--border); background:var(--surface); color:var(--ink); padding:9px 14px; border-radius:10px; font-weight:600; font-size:13.5px; cursor:pointer; display:inline-flex; align-items:center; gap:7px; white-space:nowrap; }
  .btn:hover{ border-color:var(--faint); }
  .btn:active{ transform:translateY(1px); }
  .btn svg{ width:15px; height:15px; flex:none; }
  .btn-primary{ background:var(--court); border-color:var(--court); color:var(--court-ink); }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-ghost{ background:transparent; border-color:transparent; padding:8px 10px; }
  .btn-danger{ color:var(--danger); }
  .btn-sm{ padding:6px 10px; font-size:12.5px; border-radius:8px; }
  .btn-lg{ padding:14px 18px; font-size:15px; border-radius:14px; }
  .btn-block{ width:100%; justify-content:center; }
  .btn[disabled]{ opacity:.45; cursor:not-allowed; }
  .icon-btn{ appearance:none; border:1px solid transparent; background:transparent; color:var(--muted); width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none; }
  .icon-btn:hover{ background:var(--surface-2); color:var(--ink); }
  .icon-btn svg{ width:16px; height:16px; }

  /* ---------- layout ---------- */
  /* minmax(0,1fr): a plain 1fr column can never shrink below its widest
     content (a table, a bracket, a long tab row), which is what pushed whole
     pages wider than a phone screen. */
  .layout{ display:grid; grid-template-columns:250px minmax(0,1fr); gap:18px; align-items:start; }
  .layout.no-sidebar{ grid-template-columns:minmax(0,1fr); }
  .main, .main-inner{ min-width:0; }
  @media (max-width:860px){ .layout{ grid-template-columns:minmax(0,1fr); } .sidebar{ order:2; position:static; } .main{ order:1; } }

  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
  .sidebar{ padding:12px; position:sticky; top:68px; max-height:calc(100vh - 90px); overflow-y:auto; }
  .sidebar-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; padding:0 2px;}
  .sidebar-head h2{ font-size:12.5px; margin:0; color:var(--muted); letter-spacing:.08em; }
  .t-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px; }
  .t-item{ border-radius:10px; }
  .t-item button{ width:100%; text-align:left; background:transparent; color:var(--ink); font:inherit; border:1px solid transparent; border-radius:10px; padding:9px 10px; cursor:pointer; display:flex; flex-direction:column; gap:2px; }
  .t-item button:hover{ background:var(--surface-2); }
  .t-item.active button{ background:var(--court-soft); border-color:var(--court); }
  .t-name{ font-weight:700; font-size:13.5px; }
  .t-meta{ font-size:11px; color:var(--muted); display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .empty-note{ font-size:12.5px; color:var(--faint); padding:10px 6px; }

  .main{ min-height:400px; }
  .main-inner{ padding:16px 18px; }
  .empty-hero{ display:flex; flex-direction:column; align-items:flex-start; gap:14px; padding:44px 20px; }
  .empty-hero .kicker{ color:var(--court); font-weight:700; font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; }
  .empty-hero h2{ font-size:27px; margin:0; max-width:24ch; }
  .empty-hero p{ color:var(--muted); max-width:50ch; margin:0; font-size:13.5px; }
  .empty-hero .hero-actions{ display:flex; gap:8px; flex-wrap:wrap; }

  .t-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .t-header h2{ font-size:24px; margin:0 0 4px; }
  .t-header .t-sub{ color:var(--muted); font-size:12.5px; }
  .t-header .t-actions{ display:flex; gap:8px; flex:0 1 auto; min-width:0; flex-wrap:wrap; }

  .back-link{ display:inline-flex; align-items:center; gap:5px; color:var(--muted); font-size:12.5px; font-weight:600; cursor:pointer; background:none; border:none; padding:4px 0; margin-bottom:8px; }
  .back-link:hover{ color:var(--ink); }
  .back-link svg{ width:14px; height:14px; }

  .tabs{ display:flex; flex-wrap:wrap; gap:4px; background:var(--surface-2); padding:4px; border-radius:11px; margin-bottom:16px; width:fit-content; max-width:100%; }
  .tab{ border:none; background:transparent; padding:8px 14px; border-radius:8px; font-weight:700; font-size:11.5px; letter-spacing:.03em; text-transform:uppercase; color:var(--muted); cursor:pointer; white-space:nowrap; }
  .tab.active{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }

  .pill{ display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; background:var(--surface-2); color:var(--muted); white-space:nowrap; }
  .pill.gold{ background:var(--gold-soft); color:var(--gold); }
  .pill.court{ background:var(--court-soft); color:var(--court); }
  .pill.danger{ background:var(--danger-soft); color:var(--danger); }
  .pill.live{ background:var(--gold-soft); color:var(--gold); animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.55} }

  .cat-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; }
  .cat-card{ border:1px solid var(--border); border-radius:12px; padding:14px; cursor:pointer; background:var(--surface); position:relative; transition:border-color .12s; }
  .cat-card:hover{ border-color:var(--court); }
  .cat-card h3{ font-size:15px; margin:0 0 6px; text-transform:none; letter-spacing:0; font-family:"Public Sans"; font-weight:700; }
  .cat-card .cat-meta{ color:var(--muted); font-size:11.5px; display:flex; gap:6px; flex-wrap:wrap; }
  .cat-card .cat-del{ position:absolute; top:8px; right:8px; }
  /* Only a real mouse gets hover-revealed controls. On touch screens they always
     show: iOS swallows the first tap on an element whose :hover reveals content,
     which made cards need two taps to open. */
  .cat-card .cat-del + h3{ padding-right:30px; }
  .cat-card:active{ border-color:var(--court); background:var(--surface-2); }
  .stat-tile[data-tab]{ cursor:pointer; }
  .stat-tile[data-tab]:active{ border-color:var(--court); }
  @media (hover:hover) and (pointer:fine){
    .cat-card .cat-del{ opacity:0; }
    .cat-card:hover .cat-del, .cat-card:focus-within .cat-del{ opacity:1; }
  }
  /* iOS Safari/WKWebView only delivers taps to elements that look clickable;
     every element with a tap handler therefore gets a pointer cursor. */
  [data-open-match], [data-open-event], [data-open-player], [data-open-tournament], [data-open-tab],
  [data-open-club], [data-select-tournament], [data-back-events], [data-close]{ cursor:pointer; }

  .card{ border:1px solid var(--border); border-radius:12px; padding:14px; background:var(--surface); }
  .card + .card{ margin-top:10px; }
  .row{ display:flex; align-items:center; gap:10px; }
  .row.between{ justify-content:space-between; }
  .row.wrap{ flex-wrap:wrap; }

  /* ---------- stat tiles / dashboard ---------- */
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:18px; }
  .stat-tile{ border:1px solid var(--border); border-radius:12px; padding:12px 14px; background:var(--surface); }
  .stat-tile .stat-num{ font-size:24px; font-weight:700; line-height:1.1; }
  .stat-tile .stat-label{ color:var(--muted); font-size:11px; margin-top:3px; letter-spacing:.02em; }
  .stat-tile.accent .stat-num{ color:var(--court); }
  .stat-tile.gold .stat-num{ color:var(--gold); }

  .bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .bar-row .bar-label{ width:110px; flex:none; font-size:12px; color:var(--muted); }
  .bar-track{ flex:1; height:9px; border-radius:5px; background:var(--surface-2); overflow:hidden; }
  .bar-fill{ height:100%; background:var(--court); border-radius:5px; }
  .bar-row .bar-num{ width:64px; flex:none; text-align:right; font-size:12px; color:var(--muted); }

  .ring-wrap{ display:flex; align-items:center; gap:14px; }
  .ring-label{ font-size:12px; color:var(--muted); }
  .ring-label strong{ color:var(--ink); display:block; font-size:15px; }

  .section-h{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:22px 0 10px; flex-wrap:wrap; }
  .section-h h3{ font-size:16px; text-transform:none; letter-spacing:0; font-family:"Public Sans"; font-weight:700; }
  .section-h:first-child{ margin-top:0; }

  .list-row{ display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--border); border-radius:10px; margin-bottom:8px; background:var(--surface); flex-wrap:wrap; }
  .list-row .main-txt{ font-weight:600; font-size:13.5px; }
  .list-row .sub-txt{ color:var(--muted); font-size:11.5px; }
  .list-row .grow{ flex:1; min-width:120px; }
  .seed-badge{ width:24px; height:24px; border-radius:999px; background:var(--court-soft); color:var(--court); font-weight:700; font-size:11.5px; display:flex; align-items:center; justify-content:center; flex:none; }
  .avatar{ width:30px; height:30px; border-radius:999px; background:var(--surface-2); color:var(--muted); font-weight:700; font-size:12px; display:flex; align-items:center; justify-content:center; flex:none; overflow:hidden; }
  .avatar img{ width:100%; height:100%; object-fit:cover; }

  .draw-banner{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; border-radius:12px; background:var(--court-soft); border:1px solid var(--court); margin-top:14px; flex-wrap:wrap; }
  .draw-banner p{ margin:0; font-size:13px; color:var(--ink); }
  .draw-banner strong{ color:var(--court); }
  .generated-note{ display:flex; align-items:center; gap:8px; color:var(--court); font-weight:700; font-size:13px; padding:10px 2px; }
  .conflict-warn{ display:flex; gap:8px; align-items:flex-start; padding:10px 12px; border-radius:10px; background:var(--danger-soft); color:var(--danger); font-size:12.5px; font-weight:600; margin-top:8px; }
  .conflict-warn svg{ width:15px; height:15px; flex:none; margin-top:1px; }

  /* ---------- bracket ---------- */
  .bracket-wrap{ overflow-x:auto; padding-bottom:10px; }
  .bracket{ position:relative; display:flex; gap:36px; padding:6px 6px 20px; }
  .bracket-lines{ position:absolute; top:0; left:0; pointer-events:none; overflow:visible; }
  .bracket-lines path{ fill:none; stroke:var(--border); stroke-width:2; }
  .round-col{ display:flex; flex-direction:column; justify-content:space-around; gap:14px; flex:1 1 0; min-width:150px; max-width:230px; }
  .round-label{ text-align:center; font-size:10.5px; letter-spacing:.1em; color:var(--muted); font-weight:700; text-transform:uppercase; margin-bottom:2px; }
  .match-card{ border:1px solid var(--border); border-radius:12px; background:var(--surface); overflow:hidden; cursor:default; }
  .match-card.playable, .match-card[data-open-match]{ cursor:pointer; }
  .match-card.playable:hover{ border-color:var(--court); }
  .m-slot{ display:flex; align-items:center; justify-content:space-between; padding:7px 9px; font-size:12.5px; gap:6px; }
  .m-slot + .m-slot{ border-top:1px solid var(--border); }
  .m-slot .name{ font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .m-slot.tbd .name{ color:var(--faint); font-weight:500; font-style:italic; }
  .m-slot.winner .name{ color:var(--court); }
  .m-slot .score{ font-size:11.5px; color:var(--muted); flex:none; }
  .m-status{ font-size:9.5px; text-align:center; padding:3px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); background:var(--surface-2); }
  .m-status.bye{ color:var(--gold); }
  .m-status.live{ color:var(--gold); font-weight:700; }
  .bracket-section{ margin-bottom:26px; }
  .bracket-section h4{ font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:10px; font-family:inherit; font-weight:700; }
  .bracket-section.wb h4{ color:var(--court); }
  .bracket-section.lb h4{ color:var(--danger); }
  .bracket-section.gf h4{ color:var(--gold); }

  .group-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px; }
  .group-card h4{ font-size:13px; text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; font-family:inherit; font-weight:700; color:var(--muted); }

  /* ---------- standings ---------- */
  table.standings, table.data-table{ width:100%; border-collapse:collapse; font-size:12.5px; }

  .toast-host{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; z-index:80; width:min(360px,92vw); align-items:center; }
  .toast{ background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:999px; font-size:12.5px; font-weight:600; box-shadow:var(--shadow); text-align:center; }

  @media (max-width:520px){

  .seg{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:4px; background:var(--surface-2); padding:4px; border-radius:12px; margin-bottom:20px; }

  .seg button svg{ width:18px; height:18px; }

  @media (max-width:1100px){

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2,9); }
function nowIso(){ return new Date().toISOString(); }
function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso.length<=10 ? iso+'T00:00:00' : iso);
  if(isNaN(d)) return iso;
  return d.toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
}
function fmtDateTime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  return d.toLocaleString(undefined, {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
}
function fmtTime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  return d.toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'});
}
function timeAgo(iso){
  if(!iso) return '';
  const ms = Date.now() - new Date(iso).getTime();
  const mins = Math.round(ms/60000);
  if(mins<1) return 'just now';
  if(mins<60) return mins+'m ago';
  const hrs = Math.round(mins/60);
  if(hrs<24) return hrs+'h ago';
  const days = Math.round(hrs/24);
  return days+'d ago';
}

/* ============================== SCORING RULES ============================== */
/* Configurable badminton rally-point scoring. Never trust the UI: every save
   is re-validated through these pure functions. */
const DEFAULT_SCORING = { bestOf:3, pointsToWin:21, winBy:2, capPoints:30, deuceEnabled:true };
const ScoreRules = {
  gameWinner(g, cfg){
    cfg = cfg || DEFAULT_SCORING;
    const a=g.a, b=g.b;
    if(a==null||b==null||a<0||b<0||!Number.isFinite(a)||!Number.isFinite(b)) return null;
    if(a===b) return null;
    if(!cfg.deuceEnabled){
      if(a>=cfg.pointsToWin || b>=cfg.pointsToWin) return a>b?1:2;
      return null;
    }
    const cap = cfg.capPoints||30;
    if(a>=cap||b>=cap) return a>b?1:2;
    const hi=Math.max(a,b), lo=Math.min(a,b);
    if(hi<cfg.pointsToWin) return null;
    if(hi-lo<cfg.winBy) return null;
    return a>b?1:2;
  },
  gamesNeeded(cfg){ return Math.ceil((cfg&&cfg.bestOf||3)/2); },
  matchWinner(games, cfg){
    cfg = cfg || DEFAULT_SCORING;
    let w1=0,w2=0;
    const need = this.gamesNeeded(cfg);
    for(const g of games){
      const w=this.gameWinner(g,cfg);
      if(w===1) w1++; else if(w===2) w2++;
      if(w1===need) return 1;
      if(w2===need) return 2;
    }
    return null;
  },
  isMatchComplete(games, cfg){ return this.matchWinner(games,cfg)!=null; },
  /* Recompute a/b for a game purely from its point-event log, so Undo is exact
     (pop one event) rather than a blind decrement. */
  scoreFromLog(log){
    let a=0,b=0;
    for(const ev of log||[]){ if(ev==='a') a++; else if(ev==='b') b++; }
    return {a,b};
  },
  validGameScore(g, cfg){
    cfg = cfg || DEFAULT_SCORING;
    if(g.a<0||g.b<0) return false;
    const cap = cfg.capPoints||30;
    if(g.a>cap||g.b>cap) return false;
    return true;
  }
};

/* ============================== DRAW GENERATOR ============================== */
/* Verified seeding via recursive doubling, circle-method round robin, group
   splitting + crossover seeding, and a simplified-but-structurally-correct
   double elimination skeleton (nobody is out after one loss, everybody is out
   after two). */
const DrawGenerator = {
  nextPowerOfTwo(n){ let p=1; while(p<n) p*=2; return p; },
  seedOrder(size){
    let order=[1];
    while(order.length<size){
      const n=order.length*2, next=[];
      for(const s of order){ next.push(s); next.push(n+1-s); }
      order=next;
    }
    return order;
  },
  /* Returns an array of {round, position, entry1Index, entry2Index} plans
     (indices into the ordered entries array, or null = TBD/awaiting winner). */
  singleEliminationPlan(entryCount){
    if(entryCount<2) return [];
    const size=this.nextPowerOfTwo(entryCount);
    const order=this.seedOrder(size);
    const idx=(seed)=> seed<=entryCount ? seed-1 : null;
    const plans=[];
    const r1=size/2;
    for(let i=0;i<r1;i++){
      plans.push({round:1,position:i,entry1Index:idx(order[i*2]),entry2Index:idx(order[i*2+1])});
    }
    let matchesInRound=r1, round=2;
    while(matchesInRound>1){
      const nm=matchesInRound/2;
      for(let i=0;i<nm;i++) plans.push({round,position:i,entry1Index:null,entry2Index:null});
      matchesInRound=nm; round++;
    }
    return plans;
  },
  /* Circle method: works for even and odd counts (odd = bye seat each round).
     Returns schedule[roundIndex] = [[a,b], ...] using indices into `entries`. */
  roundRobinSchedule(entryCount){
    if(entryCount<2) return [];
    let players=[...Array(entryCount).keys()];
    if(players.length%2!==0) players.push(-1);
    const n=players.length, roundsCount=n-1;
    const schedule=[];
    let arr=players.slice();
    for(let r=0;r<roundsCount;r++){
      const pairs=[];
      for(let i=0;i<n/2;i++){
        const a=arr[i], b=arr[n-1-i];
        if(a!==-1 && b!==-1) pairs.push([a,b]);
      }
      schedule.push(pairs);
      const fixed=arr[0];
      const rest=arr.slice(1);
      rest.unshift(rest.pop());
      arr=[fixed,...rest];
    }
    return schedule;
  },
  /* Split ordered entry indices into groups of ~groupSize (default 4). */
  splitGroups(entryCount, groupSize){
    groupSize = groupSize||4;
    const numGroups = Math.max(1, Math.round(entryCount/groupSize));
    const groups = Array.from({length:numGroups}, ()=>[]);
    /* snake distribution across groups keeps top seeds spread evenly */
    let dir=1, g=0;
    for(let i=0;i<entryCount;i++){
      groups[g].push(i);
      if(dir===1){ if(g===numGroups-1) dir=-1; else g++; }
      else { if(g===0) dir=1; else g--; }
    }
    return groups;
  }
};

/* ============================== STORE ============================== */
/* Tries the shared `db` capability; falls back to localStorage (per-viewer
   only, never treated as shared truth) with matching filter/subscribe/emit
   semantics. Generic over any flat top-level collection name. */
const LOCAL_KEY = 'shuttle-bracket-store-v2';
/* Live-sharing defaults. Empty here; scripts/build_web.py fills them from
   sharing/share-config.json so an App Store build works without setup. */
const SHARE_DEFAULTS = {url:'', key:'', viewerUrl:''};
/* Opened from a share link (#s=<id>&p=<project>&k=<key>)? Then this page is a
   read-only live viewer of that one tournament and never touches local data. */
const VIEWER = (function(){
  try{
    const h = new URLSearchParams((location.hash||'').replace(/^#/,''));
    const id = h.get('s'); if(!id || !/^[A-Za-z0-9]{12,40}$/.test(id)) return null;
    const ref = h.get('p'), u = h.get('u'), key = h.get('k');
    const url = (ref && /^[a-z0-9-]{3,64}$/i.test(ref)) ? 'https://'+ref.toLowerCase()+'.supabase.co'
      : (u && /^https:\/\/[^\s]+$/.test(u) ? u.replace(/\/+$/,'') : null);
    if(!url || !key) return null;
    return {id, url, key};
  }catch(e){ return null; }
})();
/* iOS app bridge (WKWebView script message handlers). Absent on the web, so
   every call is a feature-detected no-op there. In the iOS app the native
   side injects the saved database as window.__SB_NATIVE_STORE__ before this
   script runs and persists every change to a JSON file in Application
   Support (more durable than WebView localStorage, and included in backups). */
const Native = (function(){
  const h = (window.webkit && window.webkit.messageHandlers) || null;
  return {
    has(name){ return !!(h && h[name]); },
    post(name, body){ try{ h[name].postMessage(body); return true; }catch(e){ return false; } }
  };
})();
const Store = (function(){
  let db=null, mode='local';
  let local = {};
  try{
    const nativeRaw = (typeof window.__SB_NATIVE_STORE__==='string' && window.__SB_NATIVE_STORE__) ? window.__SB_NATIVE_STORE__ : null;
    const raw = VIEWER ? null : (nativeRaw || localStorage.getItem(LOCAL_KEY));
    if(raw) local=JSON.parse(raw)||{};
  }catch(e){}
  const localListeners = {};

  function ensureCol(col){ if(!local[col]) local[col]={}; if(!localListeners[col]) localListeners[col]=new Set(); }
  let nativeSaveTimer = null;
  function flushNative(){ nativeSaveTimer = null; Native.post('sbStore', JSON.stringify(local)); }
  function saveLocal(){
    try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(local)); }catch(e){}
    if(Native.has('sbStore')){ clearTimeout(nativeSaveTimer); nativeSaveTimer = setTimeout(flushNative, 250); }
  }
  const flushIfPending = ()=>{ if(nativeSaveTimer){ clearTimeout(nativeSaveTimer); flushNative(); } };
  window.addEventListener('pagehide', flushIfPending);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flushIfPending(); });
  function matchFilters(rec, filters){ return filters.every(([f,v])=> rec[f]===v); }
  function emitLocal(col){
    ensureCol(col);
    localListeners[col].forEach(entry=>{
      let arr = Object.entries(local[col]).map(([id,data])=>({id,...data})).filter(r=>matchFilters(r, entry.filters));
      arr.sort((a,b)=> (a.createdAt||'').localeCompare(b.createdAt||''));
      entry.cb(arr);
    });
  }

  async function init(){
    try{
      if(window.claude && window.claude.use){
        const d = await window.claude.use('db');
        if(d){ db=d; mode='db'; return 'db'; }
      }
    }catch(e){ console.error('db init failed, falling back to local', e); }
    mode='local';
    return 'local';
  }

  function subscribe(col, filters, cb){
    filters = filters||[];
    if(mode==='db'){
      let q = db.collection(col);
      try{ filters.forEach(([f,v])=>{ q = q.where(f,'==',v); }); }catch(e){ console.error(e); cb([]); return ()=>{}; }
      return q.onSnapshot(snap=>{
        const arr = snap.docs.map(d=>({id:d.id, ...d.data()}));
        arr.sort((a,b)=> (a.createdAt||'').localeCompare(b.createdAt||''));
        cb(arr);
      }, err=>{ console.error('db subscribe error', col, err); cb([]); });
    } else {
      ensureCol(col);
      const entry = {filters, cb};
      localListeners[col].add(entry);
      emitLocal(col);
      return ()=> localListeners[col].delete(entry);
    }
  }

  async function getAll(col, filters){
    filters = filters||[];
    if(mode==='db'){
      let q = db.collection(col);
      filters.forEach(([f,v])=>{ q = q.where(f,'==',v); });
      const snap = await q.get();
      return snap.docs.map(d=>({id:d.id, ...d.data()}));
    }
    ensureCol(col);
    return Object.entries(local[col]).map(([id,data])=>({id,...data})).filter(r=>matchFilters(r, filters));
  }

  async function add(col, data, id){
    const docId = id || uid();
    if(VIEWER) return docId;   // read-only viewer: never writes
    const body = {...data, createdAt: data.createdAt || nowIso()};
    if(mode==='db'){
      await db.collection(col).doc(docId).set(body);
    } else {
      ensureCol(col);
      local[col][docId] = body; saveLocal(); emitLocal(col);
    }
    return docId;
  }
  async function update(col, id, data){
    if(VIEWER) return;
    if(mode==='db'){
      await db.collection(col).doc(id).update(data);
    } else {
      ensureCol(col);
      if(!local[col][id]) return;
      local[col][id] = {...local[col][id], ...data}; saveLocal(); emitLocal(col);
    }
  }
  async function remove(col, id){
    if(VIEWER) return;
    if(mode==='db'){
      await db.collection(col).doc(id).delete();
    } else {
      ensureCol(col);
      delete local[col][id]; saveLocal(); emitLocal(col);
    }
  }

  return {init, subscribe, add, update, remove, getAll, mode:()=>mode};
})();

/* Wrap every write in try/catch so a db failure (offline, quota, revoked
   grant) shows a small inline toast instead of crashing the page. */
async function act(fn, okMsg){
  try{
    const result = await fn();
    if(okMsg) toast(okMsg);
    return result;
  }catch(e){
    console.error(e);
    toast('Error: ' + (e && e.message ? e.message : 'action failed'), true);
  }
}


/* ============================== LIVE SHARE LINKS ============================== */
/* A shared tournament is a read-only copy kept in the organiser's own Supabase
   project (table + functions from sharing/supabase_setup.sql). The organiser's
   app republishes it a couple of seconds after every change; the link opens this
   same page in "viewer" mode, which polls for updates. Private player details
   (email, phone, date of birth, photo) are never included. */
function shareConfig(){
  const doc = (state.settings||[]).find(s=>s.id==='share') || {};
  const pick = k => (doc[k]!=null && doc[k]!=='') ? String(doc[k]).trim() : (SHARE_DEFAULTS[k]||'');
  const cfg = {url: pick('url').replace(/\/+$/,''), key: pick('key'), viewerUrl: pick('viewerUrl')};
  if(!cfg.viewerUrl && /^https?:$/.test(location.protocol) && !/(^|\.)claude\.ai$|(^|\.)claudeusercontent\.com$/.test(location.hostname)){
    cfg.viewerUrl = location.origin + location.pathname;   // a self-hosted copy of this page can view its own links
  }
  cfg.ready = !!(cfg.url && cfg.key);
  return cfg;
}
/* Must match sb_config() in sharing/supabase_setup.sql. */
const SHARE_KEEP_DAYS = 90;          // a link is removed this many days after its last change
const SHARE_MAX_BYTES = 1024*1024;   // largest tournament a link can hold
function shareBytes(snap){ const j = typeof snap==='string' ? snap : JSON.stringify(snap); try{ return new TextEncoder().encode(j).length; }catch(e){ return j.length; } }
function shareExpiryDate(at){ if(!at) return null; const d=new Date(at); if(isNaN(d)) return null; d.setDate(d.getDate()+SHARE_KEEP_DAYS); return d; }
function isShareLive(t){ return !!(t && t.share && t.share.id && t.share.key && !t.share.expired); }
function randomToken(len){
  const abc='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  const buf=new Uint8Array(len); crypto.getRandomValues(buf);
  let s=''; for(let i=0;i<len;i++) s+=abc[buf[i]%62];
  return s;
}
const ShareAPI = {
  headers(key){
    const h={'apikey':key, 'Content-Type':'application/json'};
    if(/^eyJ/.test(key)) h['Authorization']='Bearer '+key;   // legacy anon JWT; new sb_publishable_ keys go in apikey only
    return h;
  },
  async rpc(cfg, fn, body){
    const ctrl = ('AbortController' in window) ? new AbortController() : null;
    const timer = ctrl ? setTimeout(()=>ctrl.abort(), 15000) : null;
    let res;
    try{
      res = await fetch(cfg.url+'/rest/v1/rpc/'+fn, {method:'POST', headers:ShareAPI.headers(cfg.key), body:JSON.stringify(body||{}), cache:'no-store', signal:ctrl?ctrl.signal:undefined});
    }catch(e){
      const err = new Error('offline'); err.offline = true; throw err;
    }finally{ if(timer) clearTimeout(timer); }
    const text = await res.text();
    let json=null; try{ json = text ? JSON.parse(text) : null; }catch(e){}
    if(!res.ok){
      const err = new Error((json && (json.message||json.msg||json.error)) || ('HTTP '+res.status));
      err.status = res.status; err.code = json && json.code; throw err;
    }
    return json;
  },
  explain(e){
    if(!e) return 'Unknown error';
    if(e.offline) return inClaudeFrame()
      ? 'Can\'t reach Supabase from inside Claude (this page is sandboxed). Use the iPhone app or your hosted copy of the app to share live.'
      : 'Can\'t reach Supabase. Check the internet connection and the project URL.';
    if(e.code==='PGRST202' || /could not find the function/i.test(e.message)) return 'The database isn\'t set up yet: run sharing/supabase_setup.sql in the Supabase SQL Editor.';
    if(e.code==='SB403' || e.code==='42501' || /wrong edit key/i.test(e.message)) return 'This link belongs to another copy of the tournament. Stop sharing and create a new link.';
    if(e.code==='SB410') return 'This link expired: it wasn\'t updated for '+SHARE_KEEP_DAYS+' days, so it was removed. Create a new link to share again.';
    if(e.code==='SB413' || e.tooLarge) return 'This tournament is too big to share ('+(e.kb||'over 1024')+' KB, the limit is 1024 KB).';
    if(e.code==='SB429' && /new links/i.test(e.message)) return 'Too many new links from this network today. Try again tomorrow.';
    if(e.code==='SB429') return 'Updating too often. Trying again in a moment.';
    if(e.code==='SB507') return 'The sharing storage is full, so no new links can be made right now. Existing links keep working.';
    if(e.status===401 || e.status===403 || /api key/i.test(e.message)) return 'Supabase rejected the key. Paste the publishable (or anon) key from Project Settings → API Keys.';
    return e.message;
  }
};
function inClaudeFrame(){ try{ return window.top!==window.self && /claude/.test(document.referrer||''); }catch(e){ return true; } }

/* The read-only copy of one tournament that a link shows. */
const SHARE_PLAYER_FIELDS = ['id','name','gender','clubId','skillLevel','rankingPoints','nationality','createdAt'];
function buildShareSnapshot(tid){
  const t = state.tournaments.find(x=>x.id===tid); if(!t) return null;
  const {share, ...tournament} = t;
  const regs = state.registrations.filter(r=>r.tournamentId===tid || state.events.some(e=>e.id===r.eventId && e.tournamentId===tid))
    .map(r=>({id:r.id, tournamentId:r.tournamentId, eventId:r.eventId, playerId:r.playerId, partnerId:r.partnerId||null, status:r.status, createdAt:r.createdAt}));
  const events = state.events.filter(e=>e.tournamentId===tid);
  const eventIds = new Set(events.map(e=>e.id));
  const inT = x => x.tournamentId===tid || eventIds.has(x.eventId);   // entries and draws link by event
  const entries = state.entries.filter(inT);
  const playerIds = new Set();
  regs.forEach(r=>{ playerIds.add(r.playerId); if(r.partnerId) playerIds.add(r.partnerId); });
  entries.forEach(e=> entryPlayerIds(e).forEach(p=>playerIds.add(p)));
  const players = state.players.filter(p=>playerIds.has(p.id)).map(p=>{ const o={}; SHARE_PLAYER_FIELDS.forEach(k=>{ if(p[k]!==undefined) o[k]=p[k]; }); return o; });
  const clubIds = new Set(players.map(p=>p.clubId).filter(Boolean));
  return {
    v:1, tournament,
    events, entries, registrations: regs, players,
    clubs: state.clubs.filter(c=>clubIds.has(c.id)).map(c=>({id:c.id, name:c.name, createdAt:c.createdAt})),
    draws: state.draws.filter(inT),
    matches: state.matches.filter(inT),
    courts: state.courts.filter(c=>c.tournamentId===tid)
  };
}
function shareLinkFor(t){
  const cfg = shareConfig();
  if(!t || !t.share || !cfg.viewerUrl) return '';
  const m = cfg.url.match(/^https:\/\/([a-z0-9-]+)\.supabase\.co$/i);
  const where = m ? 'p='+m[1].toLowerCase() : 'u='+encodeURIComponent(cfg.url);
  return cfg.viewerUrl.replace(/#.*$/,'') + '#s=' + t.share.id + '&' + where + '&k=' + encodeURIComponent(cfg.key);
}

/* Keeps every shared tournament's copy up to date. Data changes schedule a
   sync; unchanged tournaments are skipped; failures retry with backoff. */
const ShareSync = (function(){
  const lastSent = {};          // tid -> JSON last published successfully
  const status = {};            // tid -> {state:'syncing'|'ok'|'error', at, error}
  let timer=null, busy=false, again=false, retryMs=0;
  function schedule(delay){
    if(VIEWER) return;
    clearTimeout(timer);
    timer = setTimeout(run, delay==null ? 2000 : delay);
  }
  function setStatus(tid, s){ status[tid] = Object.assign({}, status[tid], s); ShareUI.refresh(tid); }
  async function publish(t, force){
    const snap = buildShareSnapshot(t.id); if(!snap) return;
    const json = JSON.stringify(snap);
    if(!force && lastSent[t.id]===json) return;
    const bytes = shareBytes(json);
    if(bytes > SHARE_MAX_BYTES){ const err=new Error('too large'); err.tooLarge=true; err.kb=Math.ceil(bytes/1024); throw err; }
    setStatus(t.id, {state:'syncing'});
    const at = await ShareAPI.rpc(shareConfig(), 'sb_publish', {p_id:t.share.id, p_key:t.share.key, p_data:snap});
    lastSent[t.id] = json;
    setStatus(t.id, {state:'ok', at: at || nowIso(), error:null});
  }
  async function run(force){
    if(busy){ again=true; return; }
    const cfg = shareConfig(); if(!cfg.ready) return;
    const shared = state.tournaments.filter(isShareLive);
    if(!shared.length) return;
    busy=true;
    let failed=false, soon=false;
    for(const t of shared){
      try{ await publish(t, force); }
      catch(e){
        console.error('share sync', e);
        if(e.code==='SB429' && !/new links/i.test(e.message)){ soon=true; continue; }   // updating too fast: just try again shortly
        if(e.code==='SB410'){   // expired on the server: stop syncing it and tell the organiser
          setStatus(t.id, {state:'error', error:ShareAPI.explain(e), expired:true});
          await Store.update('tournaments', t.id, {share: Object.assign({}, t.share, {expired:true, expiredAt: nowIso()})});
          continue;
        }
        // Permanent problems wait for the next change instead of retrying on a timer.
        const permanent = e.tooLarge || ['SB400','SB403','SB413','42501'].includes(e.code);
        if(!permanent) failed=true;
        setStatus(t.id, {state:'error', error:ShareAPI.explain(e), offline:!!e.offline});
      }
    }
    busy=false;
    if(failed){ retryMs = Math.min(retryMs ? retryMs*2 : 5000, 120000); schedule(retryMs); }
    else { retryMs = 0; if(soon) schedule(1500); }
    if(again){ again=false; schedule(500); }
  }
  window.addEventListener('online', ()=>schedule(500));
  return {schedule, run, publish, status:tid=>status[tid]||null, forget(tid){ delete lastSent[tid]; delete status[tid]; },
    markPublished(tid, at, json){ lastSent[tid]=json; status[tid]={state:'ok', at: at||nowIso(), error:null}; }};
})();

/* ---------- Share dialog ---------- */
const ShareUI = (function(){
  let openTid = null;
  function statusLine(t){
    const s = ShareSync.status(t.id);
    if(!s) return `<span class="share-dot"></span> Connecting&hellip;`;
    if(s.state==='syncing') return `<span class="share-dot"></span> Updating the link&hellip;`;
    if(s.state==='error') return `<span class="share-dot bad"></span> ${esc(s.error)} ${s.offline?'Retrying automatically.':''}`;
    return `<span class="share-dot ok"></span> Live &middot; up to date (${esc(fmtTime(s.at))})`;
  }
  function expiryLine(t){
    const s = ShareSync.status(t.id);
    const until = shareExpiryDate(s && s.state==='ok' ? s.at : null);
    return until
      ? `Stays active until <b>${esc(fmtDate(until.toISOString()))}</b>. Each change moves this date; links are removed ${SHARE_KEEP_DAYS} days after the last change.`
      : `Links are removed ${SHARE_KEEP_DAYS} days after the tournament last changed.`;
  }
  function body(t){
    const cfg = shareConfig();
    if(!cfg.ready){
      return `<p class="helptext" style="margin-top:0">A live link lets anyone follow <b>${esc(t.name)}</b> in a browser, with no app or sign-in: live scores, schedule, draws, results and rankings, updating as you enter scores.</p>
        <p class="helptext">It needs a free Supabase project, set up once. Follow <b>sharing/SHARING_SETUP.md</b>, then enter the details in <b>Settings → Live sharing</b>.</p>`;
    }
    if(t.share && t.share.expired){
      return `<p class="helptext" style="margin-top:0"><b>This link has expired.</b> ${esc(t.name)} wasn't changed for ${SHARE_KEEP_DAYS} days, so its shared copy was removed and the old link no longer works.</p>
        <p class="helptext">Create a new link to share it again. Anyone following the old link will need the new one.</p>`;
    }
    if(!t.share){
      return `<p class="helptext" style="margin-top:0">Anyone with the link can follow <b>${esc(t.name)}</b> in a browser, with no app or sign-in: live scores, schedule, draws, results and rankings. It updates by itself a few seconds after each change you make.</p>
        <p class="helptext">Player emails, phone numbers, birth dates and photos are never shared. You can stop sharing at any time, and links are removed automatically ${SHARE_KEEP_DAYS} days after the tournament last changed.</p>`;
    }
    const link = shareLinkFor(t);
    if(!link){
      return `<p class="helptext" style="margin-top:0">Sharing is on, but the app doesn't know the web address of your viewer page yet. Add it in <b>Settings → Live sharing → Viewer page address</b>.</p>
        <div class="share-status" id="shareStatus">${statusLine(t)}</div>`;
    }
    return `<div class="field"><label>Live link</label><input id="shareLinkInput" class="share-link" readonly value="${esc(link)}"></div>
      <div class="share-actions">
        <button type="button" class="btn btn-primary btn-sm" id="btnShareCopy">${ICONS.link} Copy link</button>
        <button type="button" class="btn btn-sm" id="btnShareSend">${ICONS.share} Share&hellip;</button>
        <button type="button" class="btn btn-sm" id="btnShareOpen">${ICONS.external} Open</button>
      </div>
      <div class="share-status" id="shareStatus">${statusLine(t)}</div>
      <div class="helptext share-expiry" id="shareExpiry">${expiryLine(t)}</div>
      <div class="share-qr">${QR.svg(link, 220)}<div class="helptext">Scan to open. Print it or show it at the venue.</div></div>`;
  }
  function foot(t){
    const cfg = shareConfig();
    if(!cfg.ready) return `<button type="button" class="btn" data-close>Close</button>${state.role==='admin'?`<button type="button" class="btn btn-primary" id="btnShareGoSettings">Open Settings</button>`:''}`;
    if(t.share && t.share.expired) return `<button type="button" class="btn" data-close>Cancel</button><button type="button" class="btn btn-primary" id="btnShareCreate">${ICONS.link} Create new link</button>`;
    if(!t.share) return `<button type="button" class="btn" data-close>Cancel</button><button type="button" class="btn btn-primary" id="btnShareCreate">${ICONS.link} Create live link</button>`;
    return `<button type="button" class="btn btn-danger" id="btnShareStop">Stop sharing</button><button type="button" class="btn" id="btnShareSync">${ICONS.refresh} Update now</button><button type="button" class="btn btn-primary" data-close>Done</button>`;
  }
  function open(t){
    openTid = t.id;
    openDialog('Share live link', body(t), foot(t));
    const dlg = document.getElementById('dlgGeneric');
    dlg.addEventListener('close', ()=>{ openTid=null; }, {once:true});
  }
  function refresh(tid){
    if(!openTid || (tid && tid!==openTid)) return;
    const t = state.tournaments.find(x=>x.id===openTid); if(!t) return;
    const el = document.getElementById('shareStatus');
    if(el) el.innerHTML = statusLine(t);
    const ex = document.getElementById('shareExpiry');
    if(ex) ex.innerHTML = expiryLine(t);
  }
  function redraw(){
    if(!openTid) return;
    const t = state.tournaments.find(x=>x.id===openTid); if(!t){ closeGenericDialog(); return; }
    document.getElementById('genericBody').innerHTML = body(t);
    document.getElementById('genericFoot').innerHTML = foot(t);
  }
  return {open, refresh, redraw, openTid:()=>openTid};
})();

async function createShareLink(t){
  const share = {id: randomToken(16), key: randomToken(40), createdAt: nowIso()};
  const snap = buildShareSnapshot(t.id);
  const bytes = shareBytes(snap);
  if(bytes > SHARE_MAX_BYTES){ toast(ShareAPI.explain({tooLarge:true, kb:Math.ceil(bytes/1024)}), true); return false; }
  let at;
  try{
    at = await ShareAPI.rpc(shareConfig(), 'sb_publish', {p_id:share.id, p_key:share.key, p_data:snap});
  }catch(e){ toast(ShareAPI.explain(e), true); return false; }
  ShareSync.forget(t.id);
  ShareSync.markPublished(t.id, at, JSON.stringify(snap));
  await updateTournament(t.id, {share});
  await audit(t.id, state.role, 'share_link_created', 'Live share link created.');
  toast('Live link created');
  return true;
}
async function stopSharing(t){
  if(!t.share) return;
  if(!t.share.expired) try{ await ShareAPI.rpc(shareConfig(), 'sb_unpublish', {p_id:t.share.id, p_key:t.share.key}); }
  catch(e){
    if(!await confirmDialog('Couldn\'t remove the online copy ('+ShareAPI.explain(e)+'). Turn sharing off in the app anyway? The old link may keep showing the last update.', {okLabel:'Turn off', title:'Stop sharing?'})) return;
  }
  await updateTournament(t.id, {share:null});
  ShareSync.forget(t.id);
  await audit(t.id, state.role, 'share_link_removed', 'Live share link removed.');
  toast('Sharing stopped');
}
async function copyText(text){
  if(Native.has('sbCopy')){ Native.post('sbCopy', text); return true; }
  try{ if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); return true; } }catch(e){}
  const ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
  ta.remove(); return ok;
}
async function shareLinkNative(t){
  const link = shareLinkFor(t); if(!link) return;
  const title = t.name + ' - live results';
  if(Native.has('sbShareURL')){ Native.post('sbShareURL', {url:link, title}); return; }
  if(navigator.share){ try{ await navigator.share({title, text:title, url:link}); return; }catch(e){ if(e && e.name==='AbortError') return; } }
  if(await copyText(link)) toast('Link copied'); else toast('Copy the link from the box above', true);
}

/* ---------- Viewer mode (someone opened a share link) ---------- */
const ViewerMode = (function(){
  let updatedAt=null, pollTimer=null, polling=false;
  const COLS = ['tournaments','clubs','players','events','registrations','entries','draws','matches','courts'];
  function apply(row){
    const d = row.data || {};
    COLS.forEach(c=>{ state[c] = c==='tournaments' ? (d.tournament?[d.tournament]:[]) : (d[c]||[]); });
    state.notifications=[]; state.auditLog=[]; state.settings=[];
    state.tid = d.tournament ? d.tournament.id : null;
    updatedAt = row.updated_at;
    state.viewerUpdatedAt = updatedAt; state.viewerError = null; state.viewerOffline = false;
    state.ready = true;
    if(d.tournament) document.title = d.tournament.name + ' · Live';
  }
  async function load(){
    const rows = await ShareAPI.rpc(VIEWER, 'sb_get', {p_id:VIEWER.id});
    const row = Array.isArray(rows) ? rows[0] : rows;
    if(!row || !row.data){ state.viewerError='gone'; state.ready=true; render(); return; }
    apply(row); render();
  }
  async function poll(){
    if(polling || document.visibilityState==='hidden') return;
    polling = true;
    try{
      const ts = await ShareAPI.rpc(VIEWER, 'sb_updated_at', {p_id:VIEWER.id});
      if(ts===null){ state.viewerError='gone'; render(); }
      else if(ts!==updatedAt || state.viewerError){ await load(); }
      else if(state.viewerOffline){ state.viewerOffline=false; render(); }
    }catch(e){
      if(!state.viewerOffline){ state.viewerOffline = true; render(); }
    }finally{ polling=false; }
  }
  async function start(){
    state.role='public'; state.view='tdetail'; state.tab='overview'; state.viewingPlayerId=null;
    document.body.classList.add('viewer-mode');
    render();
    try{ await load(); }
    catch(e){ state.ready=true; state.viewerError = e.offline ? 'offline' : 'error'; state.viewerErrorMsg = ShareAPI.explain(e); render(); }
    pollTimer = setInterval(poll, 10000);
    document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') poll(); });
    window.addEventListener('online', poll);
  }
  function errorScreen(){
    const e = state.viewerError;
    const title = e==='gone' ? 'This tournament is no longer shared' : e==='offline' ? 'You\'re offline' : 'Couldn\'t load this tournament';
    const msg = e==='gone' ? 'The organiser stopped sharing it, or the link expired (links are removed '+SHARE_KEEP_DAYS+' days after the tournament last changed), or the link is incomplete. Ask the organiser for a new link.'
      : e==='offline' ? 'Check your internet connection. The page will try again by itself.' : (state.viewerErrorMsg||'');
    return `<div class="empty-hero"><span class="kicker">Shuttle Bracket</span><h2>${esc(title)}</h2><p>${esc(msg)}</p>
      ${e!=='gone'?`<div class="hero-actions"><button class="btn btn-primary" id="btnViewerRetry">${ICONS.refresh} Try again</button></div>`:''}</div>`;
  }
  return {start, load, poll, errorScreen};
})();

/* ---------- QR code (byte mode, error correction M) ----------
   Small self-contained encoder following ISO/IEC 18004 so a share link can be
   scanned from a phone at the venue. Returns an SVG string. */
const QR = (function(){
  const ECC_M = [-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28];
  const BLK_M = [-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49];
  const bit = (x,i)=> ((x>>>i)&1)!==0;
  function rawModules(v){
    let r=(16*v+128)*v+64;
    if(v>=2){ const n=Math.floor(v/7)+2; r-=(25*n-10)*n-55; if(v>=7) r-=36; }
    return r;
  }
  const dataCodewords = v => Math.floor(rawModules(v)/8) - ECC_M[v]*BLK_M[v];
  function gmul(x,y){ let z=0; for(let i=7;i>=0;i--){ z=(z<<1)^((z>>>7)*0x11D); z^=((y>>>i)&1)*x; } return z; }
  function rsDivisor(deg){
    const r=[]; for(let i=0;i<deg-1;i++) r.push(0); r.push(1);
    let root=1;
    for(let i=0;i<deg;i++){
      for(let j=0;j<r.length;j++){ r[j]=gmul(r[j],root); if(j+1<r.length) r[j]^=r[j+1]; }
      root=gmul(root,2);
    }
    return r;
  }
  function rsRemainder(data, div){
    const r=div.map(()=>0);
    for(const b of data){ const f=b^r.shift(); r.push(0); div.forEach((c,i)=>{ r[i]^=gmul(c,f); }); }
    return r;
  }
  function alignPositions(v, size){
    if(v===1) return [];
    const n=Math.floor(v/7)+2;
    const step=(v===32)?26:Math.ceil((v*4+4)/(n*2-2))*2;
    const r=[6];
    for(let pos=size-7; r.length<n; pos-=step) r.splice(1,0,pos);
    return r;
  }
  function encode(text){
    const bytes = Array.from(new TextEncoder().encode(text));
    let v=1;
    for(;v<=40;v++){
      const ccBits = v<10?8:16;
      if(4+ccBits+bytes.length*8 <= dataCodewords(v)*8) break;
    }
    if(v>40) throw new Error('Text too long for a QR code');
    const size=v*4+17, cap=dataCodewords(v);
    // --- data bits
    const bits=[]; const put=(val,len)=>{ for(let i=len-1;i>=0;i--) bits.push((val>>>i)&1); };
    put(4,4); put(bytes.length, v<10?8:16); bytes.forEach(b=>put(b,8));
    put(0, Math.min(4, cap*8-bits.length));
    put(0, (8-bits.length%8)%8);
    for(let p=0xEC; bits.length<cap*8; p^=0xEC^0x11) put(p,8);
    const data=[]; for(let i=0;i<bits.length;i+=8){ let b=0; for(let j=0;j<8;j++) b=(b<<1)|bits[i+j]; data.push(b); }
    // --- error correction + interleave
    const nb=BLK_M[v], eccLen=ECC_M[v], raw=Math.floor(rawModules(v)/8);
    const nShort=nb-raw%nb, shortLen=Math.floor(raw/nb), div=rsDivisor(eccLen);
    const blocks=[];
    for(let i=0,k=0;i<nb;i++){
      const dat=data.slice(k, k+shortLen-eccLen+(i<nShort?0:1)); k+=dat.length;
      const ecc=rsRemainder(dat,div);
      if(i<nShort) dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    const cw=[];
    for(let i=0;i<blocks[0].length;i++) blocks.forEach((b,j)=>{ if(i!==shortLen-eccLen || j>=nShort) cw.push(b[i]); });
    // --- function patterns
    const mod=[], fn=[];
    for(let y=0;y<size;y++){ mod.push(new Array(size).fill(false)); fn.push(new Array(size).fill(false)); }
    const setF=(x,y,d)=>{ mod[y][x]=d; fn[y][x]=true; };
    for(let i=0;i<size;i++){ setF(6,i,i%2===0); setF(i,6,i%2===0); }
    const finder=(cx,cy)=>{ for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++){ const d=Math.max(Math.abs(dx),Math.abs(dy)), x=cx+dx, y=cy+dy; if(x>=0&&x<size&&y>=0&&y<size) setF(x,y,d!==2&&d!==4); } };
    finder(3,3); finder(size-4,3); finder(3,size-4);
    const ap=alignPositions(v,size), na=ap.length;
    for(let i=0;i<na;i++) for(let j=0;j<na;j++){
      if((i===0&&j===0)||(i===0&&j===na-1)||(i===na-1&&j===0)) continue;
      for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++) setF(ap[i]+dx, ap[j]+dy, Math.max(Math.abs(dx),Math.abs(dy))!==1);
    }
    const drawFormat=(mask)=>{
      const d=(0<<3)|mask;               // ECC level M = 00
      let r=d; for(let i=0;i<10;i++) r=(r<<1)^((r>>>9)*0x537);
      const b=((d<<10)|r)^0x5412;
      for(let i=0;i<=5;i++) setF(8,i,bit(b,i));
      setF(8,7,bit(b,6)); setF(8,8,bit(b,7)); setF(7,8,bit(b,8));
      for(let i=9;i<15;i++) setF(14-i,8,bit(b,i));
      for(let i=0;i<8;i++) setF(size-1-i,8,bit(b,i));
      for(let i=8;i<15;i++) setF(8,size-15+i,bit(b,i));
      setF(8,size-8,true);
    };
    drawFormat(0);
    if(v>=7){
      let r=v; for(let i=0;i<12;i++) r=(r<<1)^((r>>>11)*0x1F25);
      const b=(v<<12)|r;
      for(let i=0;i<18;i++){ const a=size-11+i%3, c=Math.floor(i/3); setF(a,c,bit(b,i)); setF(c,a,bit(b,i)); }
    }
    // --- codewords, zig-zag
    let i=0;
    for(let right=size-1; right>=1; right-=2){

    // --- choose the mask with the lowest penalty
    const maskFn=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,
      (x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,
      (x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];

    const penalty=()=>{
      let p=0, dark=0;
      const line=get=>{ let run=1; for(let k=1;k<size;k++){ if(get(k)===get(k-1)){ run++; if(run===5) p+=3; else if(run>5) p++; } else run=1; }
        const s=[]; for(let k=0;k<size;k++) s.push(get(k)?1:0); const str=s.join('');
        let idx=-1; while((idx=str.indexOf('1011101',idx+1))!==-1){
          const before=str.slice(Math.max(0,idx-4),idx), after=str.slice(idx+7,idx+11);
          if((idx<4||before==='0000') || (idx+11>size||after==='0000')) p+=40; } };
      for(let y=0;y<size;y++) line(k=>mod[y][k]);
      for(let x=0;x<size;x++) line(k=>mod[k][x]);
      for(let y=0;y<size-1;y++) for(let x=0;x<size-1;x++){ const c=mod[y][x]; if(c===mod[y][x+1]&&c===mod[y+1][x]&&c===mod[y+1][x+1]) p+=3; }
      for(let y=0;y<size;y++) for(let x=0;x<size;x++) if(mod[y][x]) dark++;

    for(let m=0;m<8;m++){ applyMask(m); drawFormat(m); const p=penalty(); if(p<bestP){ bestP=p; best=m; } applyMask(m); }
    applyMask(best); drawFormat(best);

  }
  function svg(text, px){
    const q=encode(text), n=q.size+8;

    return `<svg class="qr" viewBox="0 0 ${n} ${n}" width="${px||200}" height="${px||200}" shape-rendering="crispEdges" role="img" aria-label="QR code for the share link"><rect width="${n}" height="${n}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }
  return {encode, svg};
})();

/* ============================== MATCH GRAPH BUILDERS ============================== */
function baseMatch(f){
  return {
    tournamentId:f.tournamentId, eventId:f.eventId, drawId:f.drawId,
    bracket:f.bracket, round:f.round, position:f.position, groupId:f.groupId||null,
    entry1Id: f.e1?f.e1.id:null, entry2Id: f.e2?f.e2.id:null,
    courtId:null, scheduledStart:null, estDurationMin:30,
    actualStart:null, actualEnd:null,
    status:'pending', games:[], winnerEntryId:null,
    nextMatchId:null, nextMatchSlot:null,
    loserNextMatchId:null, loserNextMatchSlot:null,
    isThirdPlace: !!f.isThirdPlace, grKind: f.grKind||null,
    updatedAt: nowIso()
  };
}
function markSchedulable(list){
  list.forEach(m=>{
    if(m.status==='bye'||m.status==='completed') return;
    m.status = (m.entry1Id && m.entry2Id) ? 'scheduled' : 'pending';
  });
}
function propagateWinnerOnly(m, byId){
  if(m.nextMatchId && byId[m.nextMatchId]){
    const nxt = byId[m.nextMatchId];
    if(m.nextMatchSlot===1) nxt.entry1Id = m.winnerEntryId; else nxt.entry2Id = m.winnerEntryId;
  }
}
function resolveByeCascade(list){
  const byId = Object.fromEntries(list.map(m=>[m.id,m]));
  let changed=true, guard=0;
  while(changed && guard<40){
    changed=false; guard++;
    for(const m of list){
      if(m.status==='bye' || m.status==='completed') continue;
      const has1=!!m.entry1Id, has2=!!m.entry2Id;
      if(has1!==has2){
        m.status='bye';
        m.winnerEntryId = has1 ? m.entry1Id : m.entry2Id;
        propagateWinnerOnly(m, byId);
        changed=true;
      } else if(has1 && has2 && m.status==='pending'){
        m.status='scheduled';
        changed=true;
      }
    }
  }
}

function buildSingleElimination(ctx, entries, opts){
  opts = opts||{};
  const plans = DrawGenerator.singleEliminationPlan(entries.length);
  if(!plans.length) return [];
  const list=[]; const byRoundPos={};
  for(const p of plans){
    const e1 = p.entry1Index!=null?entries[p.entry1Index]:null;
    const e2 = p.entry2Index!=null?entries[p.entry2Index]:null;
    const m = baseMatch({...ctx, bracket:'SE', round:p.round, position:p.position, e1, e2});
    m.id = uid();
    list.push(m);
    (byRoundPos[p.round]=byRoundPos[p.round]||{})[p.position]=m;
  }
  const maxRound = Math.max(...list.map(m=>m.round));
  for(let r=1;r<maxRound;r++){
    const thisRound=byRoundPos[r], nextRound=byRoundPos[r+1];
    if(!thisRound||!nextRound) continue;
    Object.keys(thisRound).forEach(posStr=>{
      const pos=+posStr, m=thisRound[pos];
      const nextPos=Math.floor(pos/2);
      const next=nextRound[nextPos];
      if(!next) return;
      m.nextMatchId=next.id; m.nextMatchSlot=(pos%2===0)?1:2;
    });
  }
  if(opts.thirdPlace && byRoundPos[maxRound-1]){
    const semis = Object.values(byRoundPos[maxRound-1]).sort((a,b)=>a.position-b.position);
    if(semis.length===2){
      const tp = baseMatch({...ctx, bracket:'SE', round:maxRound, position:99, e1:null, e2:null});
      tp.id = uid(); tp.isThirdPlace = true;
      semis[0].loserNextMatchId=tp.id; semis[0].loserNextMatchSlot=1;
      semis[1].loserNextMatchId=tp.id; semis[1].loserNextMatchSlot=2;
      list.push(tp);
    }
  }
  markSchedulable(list);
  resolveByeCascade(list);
  return list;
}

function buildRoundRobin(ctx, entries){
  const schedule = DrawGenerator.roundRobinSchedule(entries.length);
  const list=[];
  const bracket = ctx.groupId ? 'GRP' : 'RR';
  schedule.forEach((pairs, ri)=>{
    pairs.forEach((pair, pi)=>{
      const m = baseMatch({...ctx, bracket, round:ri+1, position:pi, groupId:ctx.groupId||null, e1:entries[pair[0]], e2:entries[pair[1]]});
      m.id = uid();
      list.push(m);
    });
  });
  markSchedulable(list);
  return list;
}

/* ============ CLASSIC AMERICANO SCHEDULE ============
   Goal: every registered player plays the SAME number of games, and never
   partners the same person twice - ideally partnering every other player
   exactly once.

   Everyone-partners-everyone-once needs n(n-1)/2 partnerships at 2 per game,
   i.e. n(n-1)/4 games, which is a whole number only when n % 4 is 0 or 1:
   - n % 4 == 0 (4, 8, 12...): circle method; each round is a perfect
     matching of partners, n/4 games, nobody sits. n-1 rounds, n-1 games each.
   - n % 4 == 1 (5, 9, 13...): circle method with a phantom seat; one player
     sits each round (each exactly once). n rounds, n-1 games each.
   - n % 4 == 2 or 3 (6, 7, 10, 11...): a perfect schedule is mathematically
     impossible. We build the next best thing: n rounds, 2 (or 3) players sit
     each round, everyone sits exactly 2 (or 3) times, so everyone plays
     n-2 (or n-3) games with that many DIFFERENT partners - never a repeat.
     Found by a randomized search (MRV-ordered backtracking perfect matching
     per round, with restarts); verified 0 failures across thousands of runs
     for 4-40 players, typically < 10 ms.
   Returns rounds as indices into the player list: [{games:[[[a,b],[c,d]]...], sit:[...]}]. */
function americanoShuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function americanoPerfectMatching(players, used, cost){
  const left = new Set(players), out = [];
  let nodes = 0;
  function rec(){
    if(left.size===0) return true;
    if(++nodes > 5000) return false;
    let best=null, bestOpts=null;
    for(const p of left){
      const opts=[]; for(const q of left){ if(q!==p && !used[p][q]) opts.push(q); }
      if(!bestOpts || opts.length<bestOpts.length){ best=p; bestOpts=opts; if(!opts.length) return false; }
    }
    americanoShuffle(bestOpts);
    if(cost){ const k={}; bestOpts.forEach(q=>{ k[q]=cost(best,q)+Math.random()*0.5; }); bestOpts.sort((a,b)=>k[a]-k[b]); }
    left.delete(best);
    for(const q of bestOpts){
      left.delete(q); out.push([best,q]);
      if(rec()) return true;
      out.pop(); left.add(q);
    }
    left.add(best);
    return false;
  }
  return rec() ? out : null;
}
/* Pair a round's teams into games, preferring opponents who have met least. */
function americanoPairTeams(teams, oppCount){
  const pool = americanoShuffle(teams.slice()), games = [];
  const met = (t1,t2)=> t1.reduce((s,a)=> s + t2.reduce((x,b)=> x + (oppCount[a][b]||0), 0), 0);
  while(pool.length>1){
    const t = pool.shift();
    let bi = 0, bv = Infinity;
    pool.forEach((u,i)=>{ const v = met(t,u); if(v<bv){ bv=v; bi=i; } });
    const u = pool.splice(bi,1)[0];
    t.forEach(a=>u.forEach(b=>{ oppCount[a][b]=(oppCount[a][b]||0)+1; oppCount[b][a]=(oppCount[b][a]||0)+1; }));
    games.push([t,u]);
  }
  return games;
}
function americanoSchedule(n){
  if(n<4) return null;
  const mod = n%4;
  const oppCount = Array.from({length:n},()=>({}));
  if(mod===0 || mod===1){
    return DrawGenerator.roundRobinSchedule(n).map(pairs=>{
      const inRound = new Set(pairs.flat());
      return {games: americanoPairTeams(pairs, oppCount), sit: [...Array(n).keys()].filter(p=>!inRound.has(p))};
    });
  }
  const s = mod, R = n, sitsPer = s;
  const deadline = Date.now() + 4000;
  while(Date.now() < deadline){
    const used = Array.from({length:n},()=>new Uint8Array(n));
    const sitsLeft = new Array(n).fill(sitsPer);
    const plan = [];
    let ok = true;
    for(let r=0;r<R && ok;r++){
      const roundsLeft = R - r;
      let found = null;
      for(let tries=0; tries<30 && !found; tries++){
        const forced=[], cand=[];
        for(let p=0;p<n;p++){ if(sitsLeft[p]===roundsLeft) forced.push(p); else if(sitsLeft[p]>0) cand.push(p); }
        if(forced.length > s) break;
        const sit = forced.slice(), pool = cand.slice();
        while(sit.length < s && pool.length){
          const tot = pool.reduce((a,p)=>a+sitsLeft[p],0);
          let x = Math.random()*tot, idx=0;
          for(;idx<pool.length;idx++){ x-=sitsLeft[pool[idx]]; if(x<=0) break; }
          if(idx>=pool.length) idx=pool.length-1;
          sit.push(pool[idx]); pool.splice(idx,1);
        }
        if(sit.length < s) break;
        const sitSet = new Set(sit);
        const m = americanoPerfectMatching([...Array(n).keys()].filter(p=>!sitSet.has(p)), used);
        if(m) found = {sit, pairs:m};
      }
      if(!found){ ok=false; break; }
      found.sit.forEach(p=>sitsLeft[p]--);
      found.pairs.forEach(([a,b])=>{ used[a][b]=used[b][a]=1; });
      plan.push(found);
    }
    if(ok) return plan.map(f=>({games: americanoPairTeams(f.pairs, oppCount), sit: f.sit}));
  }
  return null;
}
/* Human summary of what the schedule guarantees for n players. */
function americanoPlanSummary(n){
  if(n<4) return 'Americano needs at least 4 players.';
  const mod = n%4;
  if(mod<=1) return `${n} players: everyone partners every other player exactly once and plays ${n-1} games` + (mod===1?' (one player sits out each round).':'.');
  const g = n - mod;
  return `${n} players: partnering everyone exactly once is mathematically impossible (needs a player count where n % 4 is 0 or 1, e.g. ${n-mod} or ${n+4-mod}). Everyone still plays exactly ${g} games with ${g} different partners - no repeats - and sits out ${mod} rounds.`;
}
/* Classic Americano draw: individual entries in, ad-hoc two-player "team"
   entries (tagged isAmericanoTeam) minted per round out, since matches
   reference entries. Sitting players are recorded on the draw (sitOut) rather
   than as fake matches. Ranking is by individual points (computeAmericanoStandings). */
function buildAmericano(ctx, entries){
  const plan = americanoSchedule(entries.length);
  if(!plan) throw new Error('Could not build an Americano schedule for ' + entries.length + ' players.');
  const teamEntries = [], matches = [], sitOut = {};
  plan.forEach((rd, ri)=>{
    const roundNum = ri+1;
    if(rd.sit.length) sitOut[roundNum] = rd.sit.map(i=>entries[i].player1Id);
    rd.games.forEach(([t1,t2], gi)=>{
      const mk = ([a,b])=>{
        const team = {id: uid(), eventId:ctx.eventId, player1Id:entries[a].player1Id, player2Id:entries[b].player1Id,
          seed:null, clubId:null, registrationId:null, isAmericanoTeam:true, americanoRound:roundNum};
        teamEntries.push(team); return team;
      };
      const m = baseMatch({...ctx, bracket:'AM', round:roundNum, position:gi, e1:mk(t1), e2:mk(t2)});
      m.id = uid();
      matches.push(m);
    });
  });
  markSchedulable(matches);
  return {matches, teamEntries, sitOut};
}
/* ============ ADDING MORE AMERICANO ROUNDS ============
   Extends an existing Classic/Mixed Americano draw by `count` rounds while
   keeping it fair:
   - Games stay balanced: each round, the players who have played the MOST
     so far are the ones who sit (ties broken by fewest sit-outs, then at
     random), so games never differ by more than 1 and are equal whenever the
     round count allows (see americanoEqualRoundsStep).
   - Partners repeat as little as possible: each round's partner matching
     only uses pairs that have partnered <= L times, for the smallest L that
     still yields a full matching (L=0 first, i.e. brand-new partners).
   - Classic with everyone level: whole extra cycles reuse the proven
     americanoSchedule (random player order), so each added cycle again
     partners everyone once (for player counts where that's possible).
   - Mixed: teams are always one man + one woman. */
function americanoCycleLength(n, mixed){
  if(mixed) return n;              // n = men (= women); every man meets every woman once
  return n%4===0 ? n-1 : n;
}
/* Smallest round count that keeps everyone's game count equal. */
function americanoEqualRoundsStep(n, mixedMenCount){
  const gcd=(a,b)=> b?gcd(b,a%b):a;
  if(mixedMenCount){ const m=mixedMenCount, playTeams = m - (m%2); return m / gcd(m, playTeams); }
  const playing = n - (n%4);
  return n / gcd(n, playing);
}
function americanoMoreRounds(n, count, hist, genders){
  const games = hist.games.slice(), sits = hist.sits.slice();
  const pc = hist.partner.map(r=>r.slice()), opp = hist.opp.map(o=>({...o}));
  const rounds = [];
  const idxs = [...Array(n).keys()];
  const pickSitters = (pool, k)=> americanoShuffle(pool.slice()).sort((a,b)=> (games[b]-games[a]) || (sits[a]-sits[b])).slice(0,k);
  const commit = (pairs, sit, gamesPaired)=>{
    pairs.forEach(([a,b])=>{ pc[a][b]++; pc[b][a]++; });
    pairs.flat().forEach(p=>games[p]++); sit.forEach(p=>sits[p]++);
    rounds.push({games: gamesPaired || americanoPairTeams(pairs, opp), sit});
  };
  let left = count;
  // Whole fresh cycles for Classic when everyone is level.
  if(!genders && n%4<=1){
    const cyc = americanoCycleLength(n, false);
    while(left >= cyc && games.every(g=>g===games[0])){
      const perm = americanoShuffle(idxs.slice());
      const plan = americanoSchedule(n);
      if(!plan) break;
      plan.forEach(rd=>{
        const mapped = rd.games.map(([t1,t2])=>[t1.map(i=>perm[i]), t2.map(i=>perm[i])]);
        mapped.forEach(([t1,t2])=> t1.forEach(a=>t2.forEach(b=>{ opp[a][b]=(opp[a][b]||0)+1; opp[b][a]=(opp[b][a]||0)+1; })));
        commit(mapped.flat(), rd.sit.map(i=>perm[i]), mapped);
      });
      left -= cyc;
    }
  }
  for(let r=0; r<left; r++){
    let sit;
    if(genders){
      const men = idxs.filter(i=>genders[i]==='male'), women = idxs.filter(i=>genders[i]==='female');
      const t = Math.min(men.length, women.length), playTeams = t - (t%2);
      sit = [...pickSitters(men, men.length-playTeams), ...pickSitters(women, women.length-playTeams)];
    } else {
      sit = pickSitters(idxs, n%4);
    }
    const sitSet = new Set(sit), playing = idxs.filter(p=>!sitSet.has(p));
    let pairs = null;
    const maxPc = Math.max(0, ...pc.map(row=>Math.max(0,...row)));
    const costFn = (p,q)=> pc[p][q];
    for(let L=0; L<=maxPc+1 && !pairs; L++){
      const blocked = idxs.map(p=>{ const row=new Uint8Array(n); for(let q=0;q<n;q++) row[q] = (pc[p][q]>L || (genders && genders[p]===genders[q])) ? 1 : 0; return row; });
      let best = null, bestCost = Infinity;
      for(let tries=0; tries<25; tries++){
        const m = americanoPerfectMatching(playing, blocked, costFn);
        if(!m) continue;
        const c = m.reduce((s,[a,b])=>s+pc[a][b]*pc[a][b], 0);
        if(c<bestCost){ bestCost=c; best=m; if(c===0) break; }
      }
      pairs = best;
    }
    if(!pairs) throw new Error('Could not build extra round ' + (rounds.length+1) + '.');
    commit(pairs, sit);
  }
  return rounds;
}
async function addAmericanoRounds(event, count){
  return act(async ()=>{
    const draw = eventDraw(event.id);
    if(!draw || draw.format!=='americano') throw new Error('Generate the Americano draw first.');
    const variant = event.americanoVariant||'classic';
    if(variant==='mexicano') throw new Error('Mexicano adds rounds one at a time with "Generate next round".');
    count = Math.max(1, Math.min(60, parseInt(count,10)||1));
    const pids = eventEntries(event.id).filter(e=>!e.isAmericanoTeam).map(e=>e.player1Id);
    const n = pids.length;
    if(n<4) throw new Error('Americano needs at least 4 players.');
    const idx = {}; pids.forEach((p,i)=>{ idx[p]=i; });
    const matches = eventMatches(event.id).filter(m=>m.bracket==='AM');
    const lastRound = matches.length ? Math.max(...matches.map(m=>m.round)) : 0;
    const hist = {games:new Array(n).fill(0), sits:new Array(n).fill(0),
      partner:Array.from({length:n},()=>new Array(n).fill(0)), opp:Array.from({length:n},()=>({}))};
    matches.forEach(m=>{
      const t1 = entryById(m.entry1Id), t2 = entryById(m.entry2Id);
      if(!t1||!t2) return;
      const a = entryPlayerIds(t1).map(p=>idx[p]), b = entryPlayerIds(t2).map(p=>idx[p]);
      if(a.length!==2 || b.length!==2 || [...a,...b].some(x=>x===undefined)) return;
      [...a,...b].forEach(x=>hist.games[x]++);
      [a,b].forEach(([x,y])=>{ hist.partner[x][y]++; hist.partner[y][x]++; });
      a.forEach(x=>b.forEach(y=>{ hist.opp[x][y]=(hist.opp[x][y]||0)+1; hist.opp[y][x]=(hist.opp[y][x]||0)+1; }));
    });
    Object.values(draw.americanoSitOut||{}).forEach(list=>(list||[]).forEach(p=>{ if(idx[p]!==undefined) hist.sits[idx[p]]++; }));
    const genders = variant==='mixed' ? pids.map(p=>(playerById(p)||{}).gender) : null;
    const plan = americanoMoreRounds(n, count, hist, genders);
    const ctx = {tournamentId:event.tournamentId, eventId:event.id, drawId:draw.id};
    const newEntries = [], newMatches = [], sitOut = {...(draw.americanoSitOut||{})};
    plan.forEach((rd, ri)=>{
      const roundNum = lastRound + ri + 1;
      if(rd.sit.length) sitOut[roundNum] = rd.sit.map(i=>pids[i]);
      rd.games.forEach(([t1,t2], gi)=>{
        const mk = ([a,b])=>{
          const team = {id:uid(), eventId:event.id, player1Id:pids[a], player2Id:pids[b],
            seed:null, clubId:null, registrationId:null, isAmericanoTeam:true, americanoRound:roundNum};
          newEntries.push(team); return team;
        };
        const m = baseMatch({...ctx, bracket:'AM', round:roundNum, position:gi, e1:mk(t1), e2:mk(t2)});
        m.id = uid(); newMatches.push(m);
      });
    });
    markSchedulable(newMatches);
    for(const te of newEntries) await Store.add('entries', te, te.id);
    for(const m of newMatches) await Store.add('matches', m, m.id);
    await Store.update('draws', draw.id, {americanoSitOut: sitOut});
    if(event.status==='completed') await Store.update('events', event.id, {status:'draw_published'});
    toast('Added ' + plan.length + ' round' + (plan.length>1?'s':'') + ' (rounds ' + (lastRound+1) + '-' + (lastRound+plan.length) + ')');
  });
}
